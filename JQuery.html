<!DOCTYPE html>
<!-- 单文件自包含版：CSS 与 JS 已全部内联，无任何外部依赖，双击或直接转发即可打开。 -->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>jQuery 在线速查手册 · 每个 API 名称后面都有一句中文解释</title>
<meta name="description" content="jQuery 在线速查手册：核心、属性、CSS、选择器、文档处理、筛选、事件、效果、Ajax、工具、事件对象、延迟对象、回调函数。每个 API 名称后面都有一句中文解释，点击名称展开说明、参数与示例代码。">
<style>
/* ============================================================
   jQuery 在线速查手册 —— 版式沿用 Python3 版（对齐 w3xue 速查手册）
   色值/尺寸取自原站 manual.css 实测：
     页头 #033565（高 105px = 85 + 上下 padding 10，两行 36px 黑体）
     分区标题条 #1D69B0（18px 微软雅黑居中，line-height 40px）
     链接 #0F4B8B / 悬停白字 + rgb(79,129,189) / 已访问 #005DBD
     左栏 278px、条目圆点缩进 15px、正文 12px/18px
     四栏各 24% + 5px 左内边距，右侧留白
   ============================================================ */
:root{
  --navy:      #033565;
  --sec:       #1D69B0;
  --sec-flash: #033565;
  --link:      #0F4B8B;
  --visited:   #005DBD;
  --hover-bg:  rgb(79,129,189);
  --line:      #ccc;
  --row-line:  #e9eff7;   /* 行分隔线：比 #ccc 淡得多，只做视觉分组，不做格线 */
  --text:      #333;
  --muted:     #666;
  --box:       #F2F8FF;
  --box-line:  #d4d4d4;
}
*{box-sizing:border-box}
body{
  margin:0 3px;background:#fff;color:var(--text);
  font:12px/18px Verdana,Tahoma,Arial,sans-serif,"宋体",SimSun,sans-serif;
}

/* ---------- 骨架：左栏目录从顶部开始，蓝头只覆盖右侧 ---------- */
#wrap{display:flex;align-items:flex-start}
#sidebar{
  flex:0 0 282px;width:282px;align-self:flex-start;
  position:sticky;top:0;height:100vh;overflow-y:auto;overflow-x:hidden;
  border-right:1px solid var(--line);
  padding:10px 8px 24px 5px;font-size:12px;
}
#main{flex:1 1 auto;min-width:0;padding-left:20px}   /* 原站 #content 的 padding-left，页头与内容共用同一左边界 */

/* ---------- 页头（对齐原站 #head：总高 105px，两行 36px 黑体） ---------- */
#head{
  position:relative;background:var(--navy);color:#fff;
  height:105px;padding:10px 0;margin:0 auto 16px;
  text-align:center;line-height:40px;overflow:hidden;
}
#head .brand,#head .brand2{
  display:block;color:#fff;text-decoration:none;
  font-family:黑体,SimHei,"Microsoft YaHei",sans-serif;
  font-size:36px;line-height:40px;font-weight:normal;
}
#head .brand{margin-bottom:5px}
#head .brand:hover,#head .brand2:hover{color:#fff;background:none;text-decoration:none}

.search-box{position:absolute;right:18px;top:50%;transform:translateY(-50%)}
#search{
  width:206px;height:28px;padding:0 26px 0 8px;border-radius:2px;
  border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.13);
  color:#fff;font-size:12px;font-family:inherit;outline:none;
}
#search::placeholder{color:#8fb4dd}
#search::-webkit-search-cancel-button{display:none}
#search:focus{background:rgba(255,255,255,.22);border-color:#fff}
#clearSearch{
  position:absolute;right:4px;top:50%;transform:translateY(-50%);
  width:18px;height:18px;line-height:1;padding:0;border:0;border-radius:50%;
  background:rgba(255,255,255,.25);color:#fff;font-size:13px;cursor:pointer;
}
#clearSearch:hover{background:rgba(255,255,255,.45)}

/* ---------- 左侧树形目录（对应原站 dtree：12px / #333 / 行距 19px） ---------- */
.tree-act{margin:0 0 6px;font-size:12px;line-height:19px}
.tree-act a,.tree-act a:link,.tree-act a:visited{color:var(--link);text-decoration:none}
.tree-act a:hover{color:#fff;background:var(--hover-bg);text-decoration:none}
.tree,.tree ul{list-style:none;margin:0;padding:0}
.tree li{line-height:19px}
.tree .folder{
  display:flex;align-items:center;gap:3px;cursor:pointer;
  font-weight:normal;color:#333;user-select:none;font-size:12px;
}
.tree .folder .tri{
  flex:0 0 auto;width:0;height:0;margin-right:2px;
  border-left:4px solid #999;border-top:3px solid transparent;border-bottom:3px solid transparent;
  transition:transform .15s;
}
.tree .open > .folder .tri{transform:rotate(90deg)}
.tree .folder a.sec-link,
.tree .folder a.sec-link:link{color:#333;text-decoration:none;font-weight:normal;font-size:12px}
.tree .folder a.sec-link:hover{color:#fff;background:var(--hover-bg);text-decoration:none}
.tree .sub{display:none;padding-left:14px}
.tree .open > .sub{display:block}
.tree .sub a{
  display:block;color:#333;text-decoration:none;font-size:12px;line-height:19px;
  padding:0 2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.tree .sub a:hover{color:#fff;background:var(--hover-bg);text-decoration:none}
.tree a.sel,.tree a.sel:link{background:#c0d2ec;color:#333}   /* 原站 dtree 选中态 */
.madeby{margin:12px 0 0;padding-top:8px;border-top:1px solid #e6e6e6;color:#999;font-size:12px;line-height:19px}
.madeby b{color:#0F4B8B}

/* ---------- 右侧内容：四栏密排 ---------- */
#content{padding:0 0 60px;min-width:0}
#cols{display:flex;align-items:flex-start;gap:5px;width:95%}
.col{flex:1 1 0;min-width:0}

/* 分区之间的留白：原站只有 3px，这里放大到 16px，让四个分区不糊成一片 */
.sec{margin:0 0 16px}
/* 原站 h1 的 padding/margin 被后面的全局 reset 覆盖，实测标题条就是 40px 高、无内外边距 */
.sec h1{
  margin:0;padding:0;background:var(--sec);color:#fff;
  font-weight:bold;font-size:18px;text-align:center;line-height:40px;
  font-family:"微软雅黑","Microsoft YaHei",sans-serif;
  transition:background .3s;
}
.sec.flash h1{background:var(--sec-flash)}
/* 标题条下方留 7px、条目行距 24px（原站 3px / 18px，太挤）
   每行加一条极淡的下边框（--row-line）：不靠行距分组，靠一条几乎看不见的线把行切出来。
   最后一行不加，避免和分区之间的留白叠成双线。 */
.sec ul{margin:0;padding:7px 0 0;list-style:none}
/* 分隔线要铺满整栏，所以 ul 不留左内边距、缩进改由 li 的 padding-left 提供。
   注意：这时不能再用原生的 list-style:disc —— 圆点会跟着边框盒跑到行右端，
   必须用 ::before 自己画（实测原站圆点是 4×4px、#333，位置对齐如下）。 */
.sec ul li{
  position:relative;margin:0;padding:2px 0 3px 29px;
  line-height:19px;font-size:12px;color:var(--text);
  border-bottom:1px solid var(--row-line);
}
.sec ul li::before{
  content:"";position:absolute;left:14px;top:10px;
  width:4px;height:4px;border-radius:50%;background:#333;
}
/* 必须写 li.item:last-child 而不是 li:last-child：后者的计权 (0,2,2) 高于
   .sec .note 的 (0,2,0)（伪类算一个类），会把补充说明框的虚线底边一起吃掉。 */
.sec ul li.item:last-child{border-bottom:0}
/* 说明框自带虚线边框，紧邻它的那条行分隔线是多余的（两条线只隔 10px） */
.sec ul:has(li.note) li.item:nth-last-child(2){border-bottom:0}
.sec ul li.note::before{content:none}
.sec li.js-hide{display:none}
.sec.js-hide{display:none}

.fn{color:var(--link);text-decoration:none;cursor:pointer;font-size:12px;font-family:Verdana,Tahoma,Arial,sans-serif}
.fn:visited{color:var(--visited)}
.fn:hover{color:#fff;background:var(--hover-bg);text-decoration:none}
.fn:focus{outline:1px dotted var(--link);outline-offset:1px;background:#dbe5f1}
li.open > .fn{font-weight:bold}
.ds{color:#333}
.hit{background:#ffe9a8;color:#333}

.sec .note{
  list-style:none;margin:10px 0 0;padding:6px 8px;   /* ul 已无左内边距，-29px 要去掉，否则盒子会左溢到栏外 */
  background:var(--box);border:1px dashed #b9d3ee;color:#4a5b70;font-size:12px;line-height:17px;
}
.sec .note.js-hide{display:none}

/* ---------- 点击展开的说明 / 示例（pre 沿用原站样式） ---------- */
.det{display:none;margin:8px 0 12px -22px;padding:9px 11px;background:#f7fbff;border:1px solid var(--box-line)}
li.open > .det{display:block}
.det p{margin:0 0 6px;font-size:12px;line-height:18px;color:#444}
.det p:last-child{margin-bottom:0}
.det .meta{margin:0 0 6px;color:#5b6b80;font-size:12px}
.det .meta code{background:#fff;border:1px solid var(--box-line);padding:0 3px;color:var(--link)}
.det .lbl{font-weight:bold;color:#125492}
.det pre{
  margin:10px 0 0;padding:10px;border-left:3px dashed var(--hover-bg);
  background:#efefef;overflow-x:auto;white-space:pre;
  font-family:Consolas,"Courier New",monospace;font-size:12px;line-height:1.7;color:#222;
}
pre .cm{color:#8a93a8;font-style:italic}
pre .st{color:#0f8a4f}
pre .kw{color:#a8248a}
pre .nm{color:#2f6fdb}
pre .bu{color:#b45309}
pre .fs{color:#0e7490}
pre .op{color:#7c5cd6}
/* HTML 代码块专用的三个类（JS 的类名继续复用上面那套） */
pre .tg{color:#a8248a}   /* 标签名 */
pre .at{color:#b45309}   /* 属性名 */
pre .av{color:#0f8a4f}   /* 属性值 */

/* ---------- 参数表 ---------- */
.det .par{
  width:100%;margin:8px 0 0;border-collapse:collapse;
  font-size:12px;line-height:17px;table-layout:fixed;
}
.det .par th{
  background:#e8f1fb;border:1px solid #cddff1;color:#125492;
  font-weight:bold;text-align:left;padding:2px 6px;
}
.det .par td{
  border:1px solid #dbe7f4;padding:2px 6px;vertical-align:top;
  word-break:break-word;
}
.det .par td:first-child{white-space:normal}
.det .par code{background:#fff;border:1px solid var(--box-line);padding:0 3px;color:#a8248a}
.det .par em{color:#0e7490;font-style:normal;margin-left:4px}

/* ---------- 示例组（jQuery 版一条 API 常有多个示例） ---------- */
.det .ex{margin:10px 0 0;padding-top:8px;border-top:1px dotted #cddff1}
.det .ex:first-of-type{border-top:0;padding-top:0}
.det .exhd{margin:8px 0 0;font-weight:bold;color:#125492;font-size:12px;line-height:17px}
.det .exhd:first-child{margin-top:0}
.det .exhd + pre{margin-top:3px}
.det .exNum{
  display:inline-block;margin-right:5px;padding:0 5px;border-radius:8px;
  background:#dbe7f4;color:#125492;font-size:11px;font-weight:normal;
}
.det pre.res{background:#f4f4f4;border-left-color:#bbb;color:#555}

/* ---------- 附加的整张速查表（正则表达式） ---------- */
.det .tb{width:100%;margin:0;border-collapse:collapse;font-size:12px;line-height:17px}
.det .tb th{
  background:#e8f1fb;border:1px solid #cddff1;color:#125492;
  padding:2px 6px;text-align:left;
}
.det .tb td{border:1px solid #dbe7f4;padding:2px 6px;vertical-align:top;word-break:break-word}
.det .tb td:first-child{
  width:30%;white-space:normal;font-family:Consolas,"Courier New",monospace;color:#a8248a;
}

/* ---------- 空结果 ---------- */
.no-result{padding:50px 20px;text-align:center;color:#888;font-size:14px;line-height:26px}
.no-result strong{display:block;font-size:16px;color:#555;margin-bottom:6px}

/* 中等宽度：搜索框收窄，避免与居中的品牌字重叠 */
@media (max-width:1240px){
  #search{width:150px}
}

/* ---------- 窄屏：左栏收成顶部一段，栏数交给 JS 按窗口宽度决定 ---------- */
@media (max-width:1000px){
  #wrap{display:block}
  #sidebar{
    position:static;height:auto;max-height:none;width:auto;flex:none;
    border-right:0;border-bottom:2px solid var(--navy);padding:10px 12px 14px;
  }
  #head{height:auto;padding:12px 16px;line-height:34px}
  #head .brand,#head .brand2{font-size:24px;line-height:32px;display:inline-block}
  #head .brand{margin:0 6px 0 0}
  .search-box{position:static;transform:none;margin:10px auto 0;max-width:340px}
  #search{width:100%}
  #content{padding:12px 12px 40px}
  #main{padding-left:0}
  #cols{width:100%}
}

body pre.hl-dark span.tk-bi,body pre.hl-dark code span.tk-bi{color:#6ee7b7!important}

</style>

</head>
<body id="top">

<!-- 版式对齐 w3xue 速查手册：左栏目录从页面顶部开始，蓝色页头只覆盖右侧内容区 -->
<div id="wrap">

  <aside id="sidebar">
    <p class="tree-act">
      <a href="javascript:;" id="expandAll">全部展开</a> |
      <a href="javascript:;" id="collapseAll">全部折叠</a>
    </p>
    <ul class="tree" id="tree"></ul>
    <p class="madeby" id="madeby"></p>
  </aside>

  <div id="main">

    <div id="head">
      <a class="brand" href="#top">jQuery</a>
      <a class="brand2" href="#top">在线速查手册</a>
      <div class="search-box">
        <input id="search" type="search" placeholder="搜索 API 名称或中文解释…" autocomplete="off" spellcheck="false">
        <button id="clearSearch" type="button" title="清空" hidden>×</button>
      </div>
    </div>

    <div id="content">
      <div id="cols"></div>
      <div id="noResult" class="no-result" hidden>
        <strong>没有找到匹配的条目</strong>
        换个关键词试试，比如「选择器」「动画」「attr」「Ajax」。
      </div>
    </div>

  </div>

</div>

<script>
/* ===== categories.js ===== */
/* 分区定义 —— 顺序对齐 jq22 jQuery 在线手册左侧目录 */
const SECTIONS = [
  { id: 'core', name: '核心', key: 'CORE' },
  { id: 'attributes', name: '属性', key: 'ATTR' },
  { id: 'css', name: 'CSS', key: 'JQCSS' },
  { id: 'selectors', name: '选择器', key: 'SELECTOR' },
  { id: 'manipulation', name: '文档处理', key: 'MANIP' },
  { id: 'traversing', name: '筛选', key: 'TRAVERSING' },
  { id: 'events', name: '事件', key: 'EVENTS' },
  { id: 'effects', name: '效果', key: 'EFFECTS' },
  { id: 'ajax', name: 'Ajax', key: 'AJAX' },
  { id: 'utilities', name: '工具', key: 'UTIL' },
  { id: 'Eventobject', name: '事件对象', key: 'EVENTOBJ' },
  { id: 'Deferred', name: '延迟对象', key: 'DEFERRED' },
  { id: 'Callbacks', name: '回调函数', key: 'CALLBACKS' },
  { id: 'Other', name: '其它', key: 'OTHER' },
];

/* 每个分区末尾的补充说明 */
const SECTION_NOTES = {
  core: "jQuery 的构造与对象访问方法；$(...) 是 jQuery(...) 的简写。",
  attributes: "操作元素属性与 class；注意 attr() 与 prop() 的区别（自定义属性用 attr，checked/disabled 等用 prop）。",
  css: "读写样式、尺寸与位置；数值型 API 默认返回不带单位的数字。",
  selectors: "与 CSS 选择器基本一致，另含 jQuery 扩展的 :eq/:first/:last 等；返回值为匹配到的元素集合。",
  manipulation: "增删改 DOM 节点；append/prepend 是「移入」，after/before 是「并列插入」。",
  traversing: "在元素集合里上下左右查找与过滤，多数方法返回新的 jQuery 对象，可链式调用。",
  events: "事件绑定与触发；jQuery 1.7+ 统一用 on()/off()，早期 bind/live/delegate 已不推荐。",
  effects: "动画与显隐；不传 speed 就是瞬时完成，传了才是动画。",
  ajax: "Ajax 请求与全局设置，底层 $.ajax() 之上有 $.get()/$.post()/$.getJSON() 等快捷方法。",
  utilities: "不依赖选择器的工具方法，如类型判断、遍历、字符串处理。",
  Eventobject: "事件回调收到的 e 对象；IE 与现代浏览器差异已由 jQuery 抹平。",
  Deferred: "jQuery 1.5 引入的异步编程工具，Promise 的早期实现；$.ajax 返回的就是 Deferred。",
  Callbacks: "jQuery 1.7 引入的回调队列管理，Deferred 内部就是用它实现的。",
  Other: "不属于以上分类的附加内容。",
};
;

/* ===== data-core.js ===== */
/* 数据来源：jq22 jQuery 在线手册 https://www.jq22.com/chm/jquery/
   每条 = 名称 + 一句中文解释 + 返回值/版本/说明/参数/示例 */

{"n": "jQuery([sel,[context]])", "b": "这个函数接收一个包含 CSS 选择器的字符串，然后用这个字符串去匹配一组元素。", "r": "jQuery", "d": "jQuery 的核心功能都是通过这个函数实现的。 jQuery中的一切都基于这个函数，或者说都是在以某种方式使用这个函数。这个函数最基本的用法就是向它传递一个表达式（通常由 CSS 选择器组成），然后根据这个表达式来查找所有匹配的元素。\n默认情况下, 如果没有指定context参数，$()将在当前的 HTML document中查找 DOM 元素；如果指定了 context 参数，如一个 DOM 元素集或 jQuery 对象，那就会在这个 context 中查找。在jQuery 1.3.2以后，其返回的元素顺序等同于在context中出现的先后顺序。\n参考文档中 选择器 部分获取更多用于 expression 参数的 CSS 语法的信息。", "par": [["selector,[context]", "String,Element,/jQuery", "V1.0", "selector:用来查找的字符串"]], "ex": [{"d": "找到所有 p 元素，并且这些元素都必须是 div 元素的子元素。", "j": "$(\"div > p\");"}, {"d": "设置页面背景色。", "j": "$(document.body).css( \"background\", \"black\" );"}, {"d": "隐藏一个表单中所有元素。", "j": "$(myForm.elements).hide()"}, {"d": "在文档的第一个表单中，查找所有的单选按钮(即: type 值为 radio 的 input 元素)。", "j": "$(\"input:radio\", document.forms[0]);"}, {"d": "在一个由 AJAX 返回的 XML 文档中，查找所有的 div 元素。", "j": "$(\"div\", xml.responseXML);"}]},
{"n": "jQuery(html,[ownerDoc])", "b": "根据提供的原始 HTML 标记字符串，动态创建由 jQuery 对象包装的 DOM …", "r": "jQuery", "v": "1.8*", "d": "你可以传递一个手写的 HTML 字符串，或者由某些模板引擎或插件创建的字符串，也可以是通过 AJAX 加载过来的字符串。但是在你创建 input 元素的时会有限制，可以参考第二个示例。当然这个字符串可以包含斜杠 (比如一个图像地址)，还有反斜杠。当你创建单个元素时，请使用闭合标签或 XHTML 格式。例如，创建一个 span ，可以用$(\"<span/>\") 或 $(\"<span></span>\") ，但不推荐 $(\"<span>\")。在jQuery 中，这个语法等同于$(document.createElement(\"span\")) 。\n在jQuery 1.8中，通过$(html,props)， 您可以使用任何jQuery对象的方法或插件。在此之前，你只能使用一个方法名的短名单，并有没有成文的方式添加到列表中。现在并不需要是一个列表，在所有！然而，请注意，这可能会导致你的代码的行为改变，如果插件添加后，有相同的名称作为HTML属性。", "par": [["html,[ownerDocument]", "String,Document", "V1.0", "html:用于动态创建DOM元素的HTML标记字符串"]], "ex": [{"d": "动态创建一个 div 元素（以及其中的所有内容），并将它追加到 body 元素中。在这个函数的内部，是通过临时创建一个元素，并将这个元素的 innerHTML 属性设置为给定的标记字符串，来实现标记到 DOM 元素转换的。所以，这个函数既有灵活性，也有局限性。", "j": "$(\"<div><p>Hello</p></div>\").appendTo(\"body\");"}, {"d": "创建一个 <input> 元素必须同时设定 type 属性。因为微软规定 <input> 元素的 type 只能写一次。", "j": "// 在 IE 中无效:\n$(\"<input>\").attr(\"type\", \"checkbox\");\n// 在 IE 中有效:\n$(\"<input type='checkbox'>\");"}, {"d": "动态创建一个 div 元素（以及其中的所有内容），并将它追加到 body 元素中。在这个函数的内部，是通过临时创建一个元素，并将这个元素的 innerHTML 属性设置为给定的标记字符串，来实现标记到 DOM 元素转换的。所以，这个函数既有灵活性，也有局限性。", "j": "$(\"<div>\", {\n\"class\": \"test\",\ntext: \"Click me!\",\nclick: function(){\n$(this).toggleClass(\"test\");\n}\n}).appendTo(\"body\");"}, {"d": "创建一个 <input> 元素，同时设定 type 属性、属性值，以及一些事件。", "j": "$(\"<input>\", {\ntype: \"text\",\nval: \"Test\",\nfocusin: function() {\n$(this).addClass(\"active\");\n},\nfocusout: function() {\n$(this).removeClass(\"active\");\n}\n}).appendTo(\"form\");"}]},
{"n": "jQuery(callback)", "b": "$(document).ready()的简写。", "r": "jQuery", "d": "允许你绑定一个在DOM文档载入完成后执行的函数。这个函数的作用如同$(document).ready()一样，只不过用这个函数时，需要把页面中所有需要在 DOM 加载完成时执行的$()操作符都包装到其中来。从技术上来说，这个函数是可链接的－－但真正以这种方式链接的情况并不多。\n你可以在一个页面中使用任意多个$(document).ready事件。参考 ready(Function) 获取更多 ready 事件的信息。", "par": [["callback", "Function", "V1.0", "当DOM加载完成后要执行的函数"]], "ex": [{"d": "当DOM加载完成后，执行其中的函数。", "j": "$(function(){\n// 文档就绪\n});"}, {"d": "使用 $(document).ready() 的简写，同时内部的 jQuery 代码依然使用 $ 作为别名，而不管全局的 $ 为何。", "j": "jQuery(function($) {\n// 你可以在这里继续使用$作为别名...\n});"}]},
{"n": "jQuery.holdReady(hold)", "b": "暂停或恢复.ready() 事件的执行。", "r": "Boolean", "v": "1.6+", "d": "在$.holdReady()方法允许调用者延迟jQuery的ready事件。这种先进的功能，通常是使用动态脚本加载器，要加载的JavaScript比如 jQuery插件，如额外的ready事件才让事件发生，即使在DOM可能准备。此方法必须早在文件调用，在这样<head> jQuery脚本后，立即标记。ready事件之后调用此方法即使已经发射也将没有任何效果。\n要延迟ready事件，第一次调用的$.holdReady(true)。当ready事件应该执行时，调用$.holdReady(false) 。请注意，多个holds可以放在ready事件上，每个$.holdReady(true)逐一调用。ready事件将不会执行，直到所有已发布了相应的一个$.holdReady(false) 和正常的文件准备好条件得到满足。（见ready的更多信息。）", "par": [["hold", "", "V1.6", "指示是否暂停或恢复被请求的ready事件"]], "ex": [{"d": "延迟就绪事件，直到已加载的插件。", "j": "$.holdReady(true);\n$.getScript(\"myplugin.js\", function() {\n$.holdReady(false);\n});"}]},

{"n": "one(type,[data],fn)", "b": "为每一个匹配元素的特定事件（像click）绑定一个一次性的事件处理函数。", "r": "jQuery", "d": "在每个对象上，这个事件处理函数只会被执行一次。其他规则与bind()函数相同。这个事件处理函数会接收到一个事件对象，可以通过它来阻止（浏览器）默认的行为。如果既想取消默认的行为，又想阻止事件起泡，这个事件处理函数必须返回false。\n多数情况下，可以把事件处理函数定义为匿名函数（见示例一）。在不可能定义匿名函数的情况下，可以传递一个可选的数据对象作为第二个参数（而事件处理函数则作为第三个参数），见示例二。", "par": [["type,[data],fn", "String,Object,Function", "V1.1", "type:添加到元素的一个或多个事件。由空格分隔多个事件。必须是有效的事件。"]], "ex": [{"d": "当所有段落被第一次点击的时候，显示所有其文本。", "j": "$(\"p\").one(\"click\", function(){\nalert( $(this).text() );\n});"}]},
{"n": "trigger(type,[data])", "b": "在每一个匹配的元素上触发某类事件。", "r": "jQuery", "d": "这个函数也会导致浏览器同名的默认行为的执行。比如，如果用trigger()触发一个'submit'，则同样会导致浏览器提交表单。如果要阻止这种默认行为，应返回false。\n你也可以触发由bind()注册的自定义事件而不限于浏览器默认事件。\n事件处理函数会收到一个修复的(规范化的)事件对象，但这个对象没有特定浏览器才有的属性，比如keyCode。\njQuery也支持 <a href=\"http://docs.jquery.com/Namespaced_Events\">命名空间事件</a>。这允许你触发或者解除绑定一组特定的事件处理函数，而无需一一个指定。你可以在事件类型后面加上感叹号 ! 来只触发那些没有命名空间的事件处理函数。\njQuery 1.3中新增：\n所有触发的事件现在会冒泡到DOM树上了。举例来说，如果你在一个段落p上触发一个事件，他首先会在这个元素上触发，其次到父元素，在到父元素的父元素，直到触发到document对象。这个事件对象有一个 .target 属性指向最开始触发这个事件的元素。你可以用 stopPropagation() 来阻止事件冒泡，或者在事件处理函数中返回false即可。\n事件对象构造器现在已经公开，并且你可以自行创建一个事件对象。这个事件对象可以直接传递给trigger所触发的事件处理函数。事件对象的完整属性列表可以在 <a href=\"http://docs.jquery.com/Events/jQuery.Event\">jQuery.Event</a> 的文档里找到。\n你可以有三种方式指定事件类型：\n* 你可以传递字符串型的事件名称(type参数)。\n* 你可以使用jQuery.Event对象。可以将数据放进这个对象，并且这个对象可以被触发的事件处理函数获取到。\n* 最后，你可以传递一个带有数据的字面量对象。他将被复制到真正的jQuery.Event对象上去。 注意在这种情况下你'''必须'''指定一个 <em>type</em> 属性。", "par": [["type,[data]", "String|Event,Array", "V1.0", "type:一个事件对象或者要触发的事件类型"]], "ex": [{"d": "提交第一个表单，但不用submit()", "j": "$(\"form:first\").trigger(\"submit\")"}, {"d": "给一个事件传递参数", "j": "$(\"p\").click( function (event, a, b) {\n// 一个普通的点击事件时，a和b是undefined类型\n// 如果用下面的语句触发，那么a指向\"foo\",而b指向\"bar\"\n} ).trigger(\"click\", [\"foo\", \"bar\"]);"}, {"d": "下面的代码可以显示一个\"Hello World\"", "j": "$(\"p\").bind(\"myEvent\", function (event, message1, message2) {\nalert(message1 + ' ' + message2);\n});\n$(\"p\").trigger(\"myEvent\", [\"Hello\",\"World!\"]);"}]},
{"n": "triggerHandler(type, [data])", "b": "这个特别的方法将会触发指定的事件类型上所有绑定的处理函数。", "r": "jQuery", "d": "这个方法的行为表现与trigger类似，但有以下三个主要区别：\n* 第一，他不会触发浏览器默认事件。\n* 第二，只触发jQuery对象集合中第一个元素的事件处理函数。\n* 第三，这个方法的返回的是事件处理函数的返回值，而不是据有可链性的jQuery对象。此外，如果最开始的jQuery对象集合为空，则这个方法返回 undefined 。", "par": [["type,[data]", "String,Array", "V1.2", "type:要触发的事件类型"]], "ex": [{"d": "如果你对一个focus事件执行了 .triggerHandler() ，浏览器默认动作将不会被触发，只会触发你绑定的动作。", "h": "<button id=\"old\">.trigger(\"focus\")</button>\n<button id=\"new\">.triggerHandler(\"focus\")</button><br/><br/>\n<input type=\"text\" value=\"To Be Focused\"/>", "j": "$(\"#old\").click(function(){\n$(\"input\").trigger(\"focus\");\n});\n$(\"#new\").click(function(){\n$(\"input\").triggerHandler(\"focus\");\n});\n$(\"input\").focus(function(){\n$(\"<span>Focused!</span>\").appendTo(\"body\").fadeOut(1000);\n});"}]},
{"n": "unbind(type,[data|fn])", "b": "bind()的反向操作，从每一个匹配的元素中删除绑定的事件。", "r": "jQuery", "d": "如果没有参数，则删除所有绑定的事件。\n你可以将你用bind()注册的自定义事件取消绑定。\n如果提供了事件类型作为参数，则只删除该类型的绑定事件。\n如果把在绑定时传递的处理函数作为第二个参数，则只有这个特定的事件处理函数会被删除。", "par": [["type,[fn]", "String,Function", "V1.0", "type:删除元素的一个或多个事件,由空格分隔多个事件值。"]]},
{"n": "live(type,[data],fn)", "b": "jQuery 给所有匹配的元素附加一个事件处理函数…", "r": "jQuery", "v": "1.7-", "d": "这个方法是基本是的 .bind() 方法的一个变体。使用 .bind() 时，选择器匹配的元素会附加一个事件处理函数，而以后再添加的元素则不会有。为此需要再使用一次 .bind() 才行。比如说\n<body>\n<div class=\"clickme\">Click here</div>\n</body>\n[[/PRE]]\n可以给这个元素绑定一个简单的click事件：\n\n$('.clickme').bind('click', function() {\nalert(\"Bound handler called.\");\n});[[/PRE]]\n当点击了元素，就会弹出一个警告框。然后，想象一下这之后有另一个元素添加进来了。\n$('body').append('<div class=\"clickme\">Another target</div>');\n尽管这个新的元素也能够匹配选择器 \".clickme\" ，但是由于这个元素是在调用 .bind() 之后添加的，所以点击这个元素不会有任何效果。\n.live() 就提供了对应这种情况的方法。如果我们是这样绑定click事件的：\n$('.clickme').live('click', function() {\nalert(\"Live handler called.\");\n});[[/PRE]]\n然后再添加一个新元素：\n\n$('body').append('<div class=\"clickme\">Another target</div>');\n[[/PRE]]\n然后再点击新增的元素，他依然能够触发事件处理函数。\n事件委托\n.live() 方法能对一个还没有添加进DOM的元素有效，是由于使用了事件委托：绑定在祖先元素上的事件处理函数可以对在后代上触发的事件作出回应。传递给 .live() 的事件处理函数不会绑定在元素上，而是把他作为一个特殊的事件处理函数，绑定在 DOM 树的根节点上。在我们的例子中，当点击新的元素后，会依次发生下列步骤：\n生成一个click事件传递给\n来处理\n由于没有事件处理函数直接绑定在 <divgt; 上，所以事件冒泡到DOM树上\n事件不断冒泡一直到DOM树的根节点，默认情况下上面绑定了这个特殊的事件处理函数。\n执行由 .live() 绑定的特殊的 click 事件处理函数。\n这个事件处理函数首先检测事件对象的 target 来确定是不是需要继续。这个测试是通过检测 $(event.target).closest('.clickme') 能否找到匹配的元素来实现的。\n如果找到了匹配的元素，那么调用原始的事件处理函数。\n由于只有在事件发生时才会在上面的第五步里做测试，因此在任何时候添加的元素都能够响应这个事件。\n附加说明\n.live() 虽然很有用，但由于其特殊的实现方式，所以不能简单的在任何情况下替换 .bind()。主要的不同有：\n在jQuery 1.4中，.live()方法支持自定义事件，也支持所有的 JavaScript 事件。在jQuery 1.4.1中，甚至也支持 focus 和 blue 事件了（映射到更合适，并且可以冒泡的focusin和focusout上）。另外，在jQuery 1.4.1中，也能支持hover（映射到\"mouseenter mouseleave\"）。然而在jQuery 1.3.x中，只支持支持的JavaScript事件和自定义事件：click, dblclick, keydown, keypress, keyup, mousedown, mousemove, mouseout, mouseover, 和 mouseup.\n.live() 并不完全支持通过DOM遍历的方法找到的元素。取而代之的是，应当总是在一个选择器后面直接使用 .live() 方法，正如前面例子里提到的。\n当一个事件处理函数用 .live() 绑定后，要停止执行其他的事件处理函数，那么这个函数必须返回 false。 仅仅调用 .stopPropagation() 无法实现这个目的。\n参考 .bind() 方法可以获得更多关于事件绑定的信息。\n在jQuery 1.4.1 中，.live() 能接受多个，用空间分隔事件，在提供类似.bind()的功能 。例如，我们可以“live ” 同时绑定mouseover和mouseout事件,像这样：\n\n$('.hoverme').live('mouseover mouseout', function(event) {\nif (event.type == 'mouseover') {\n// do something on mouseover\n} else {\n// do something on mouseout\n}\n});[[/PRE]]\n在jQuery 1.4.3中:你可以绑定一个或多个事件类型的字符串和函数的数据映射来执行他们\n\n$(\"a\").live({\nclick: function() {\n// do something on click\n},\nmouseover: function() {\n// do something on mouseover\n}\n});[[/PRE]]\n在jQuery 1.4 中，data参数可以用于把附加信息传递给事件处理函数。一个很好的用处是应付由闭包导致的问题。可以参考 .bind() 的讨论来获得更多信息。\n在jQuery 1.4 中， live事件可以绑定到“context”DOM元素，而不是默认的文档的根。要设置此背景下，我们通过在一个单一的DOM元素(而不是一个jQuery集合或选择器)使用jQuery() function's second argument。\n\n$('div.clickme', $('#container')[0]).live('click', function() {\n// Live handler called.\n});[[/PRE]]\n从 jQuery 1.7 开始，不再建议使用 .live() 方法。请使用 .on() 来添加事件处理。使用旧版本的用户，应该优先使用 .delegate() 来替代 .live()。", "par": [["type,[fn]", "String,Function", "V1.3", "type:一个或多个事件类型，由空格分隔多个事件。"]], "ex": [{"d": "点击生成的p依然据有同样的功能。", "h": "<p>Click me!</p>", "j": "$(\"p\").live(\"click\", function(){\n$(this).after(\"<p>Another paragraph!</p>\");\n});"}, {"d": "阻止默认事件行为和事件冒泡，返回 false", "j": "$(\"a\").live(\"click\", function() { return false; });"}, {"d": "仅仅阻止默认事件行为", "j": "$(\"a\").live(\"click\", function(event){\nevent.preventDefault();\n});"}]},
{"n": "die(type,[fn])", "b": "从元素中删除先前用.live()绑定的所有事件.(此方法与live正好完全相反。", "r": "jQuery", "v": "1.7-", "d": "如果不带参数，则所有绑定的live事件都会被移除。\n你可以解除用live注册的自定义事件。\n如果提供了type参数，那么会移除对应的live事件。\n如果也指定了第二个参数function,则只移出指定的事件处理函数。\n从 jQuery 1.7 开始，不再建议使用 .die() (以及它的互补方法 .live())。请使用 .off() 来代替，用于移除通过 .on() 绑定的事件处理。\n注意: 为了保证 .die() 能正确工作，所使用的选择器必须与初始化 .live() 时所使用的选择器保持一致。", "par": [["type[,fn]", "String,Function", "", "type:要移除的一个或多个事件处理程序。由空格分隔多个事件值。必须是有效的事件。"]], "ex": [{"d": "给按钮解除click事件", "j": "function aClick() {\n$(\"div\").show().fadeOut(\"slow\");\n}\n$(\"#unbind\").click(function () {\n$(\"#theone\").die(\"click\", aClick)\n});"}]},
{"n": "delegate(selector,[type],[data],fn)", "b": "指定的元素（属于被选元素的子元素）添加一个或多个事件处理程序…", "r": "jQuery", "d": "使用 delegate() 方法的事件处理程序适用于当前或未来的元素（比如由脚本创建的新元素）。", "par": [["selector,[type],fn", "String,String,Function", "V1.4.2", "selector:选择器字符串，用于过滤器触发事件的元素。"]], "ex": [{"d": "当点击鼠标时，隐藏或显示 p 元素：", "h": "<div style=\"background-color:red\">\n<p>这是一个段落。</p>\n<button>请点击这里</button>\n</div>", "j": "$(\"div\").delegate(\"button\",\"click\",function(){\n$(\"p\").slideToggle();\n});"}]},

{"n": "hover([over,]out)", "b": "一个模仿悬停事件（鼠标移动到一个对象上面及移出这个对象）的方法。", "r": "jQuery", "d": "当鼠标移动到一个匹配的元素上面时，会触发指定的第一个函数。当鼠标移出这个元素时，会触发指定的第二个函数。而且，会伴随着对鼠标是否仍然处在特定元素中的检测（例如，处在div中的图像），如果是，则会继续保持“悬停”状态，而不触发移出事件（修正了使用mouseout事件的一个常见错误）。", "par": [["over,out", "Function,Function", "V1.0", "over:鼠标移到元素上要触发的函数"]], "ex": [{"j": "$(\"td\").hover(\nfunction () {\n$(this).addClass(\"hover\");\n},\nfunction () {\n$(this).removeClass(\"hover\");\n}\n);"}]},

{"n": "blur([[data],fn])", "b": "当元素失去焦点时触发 blur 事件。", "r": "jQuery", "d": "这个函数会调用执行绑定到blur事件的所有函数，包括浏览器的默认行为。可以通过返回false来防止触发浏览器的默认行为。blur事件会在元素失去焦点的时候触发，既可以是鼠标行为，也可以是按tab键离开的", "par": [["fn", "Function", "V1.0", "在每一个匹配元素的blur事件中绑定的处理函数。"]], "ex": [{"d": "触发所有段落的blur事件", "j": "$(\"p\").blur();"}, {"d": "任何段落失去焦点时弹出一个 \"Hello World!\"在每一个匹配元素的blur事件中绑定的处理函数。", "j": "$(\"p\").blur( function () { alert(\"Hello World!\"); } );"}]},

{"n": "error([[data],fn])", "b": "当元素遇到错误（没有正确载入）时，发生 error 事件。", "r": "jQuery", "d": "这个函数会调用所有绑定到error事件上的函数，包括在对应元素上的浏览器默认行为。可以通过在某个绑定的函数中返回false来防止触发浏览器的默认行为。error事件通常可以在元素由于点击或者tab导航失去焦点时触发。\n对于error事件，没有一个公众的标准。在大多数浏览器中，当页面的JavaScript发生错误时，window对象会触发error事件;当图像的src属性无效时，比如文件不存在或者图像数据错误时，也会触发图像对象的error事件。\n如果异常是由window对象抛出，事件处理函数将会被传入三个参数：\n1. 描述事件的信息 (\"varName is not defined\", \"missing operator in expression\", 等等.),\n2. 包含错误的文档的完整URL\n3. 异常发生的行数 如果事件处理函数返回true，则表示事件已经被处理，浏览器将认为没有异常。\n更多相关信息:\nmsdn - onerror Event\nGecko DOM Reference - onerror Event\nGecko DOM Reference - Event object\nWikipedia: DOM Events<", "par": [["fn", "Function", "V1.0", "在每一个匹配元素的error事件中绑定的处理函数。"]], "ex": [{"d": "在服务器端记录JavaScript错误日志:", "j": "$(window).error(function(msg, url, line){\njQuery.post(\"js_error_log.php\", { msg: msg, url: url, line: line });\n});"}, {"d": "隐藏JavaScript错误:", "j": "$(window).error(function(){\nreturn true;\n});"}, {"d": "给你IE的用户隐藏无效的图像:", "j": "$(\"img\").error(function(){\n$(this).hide();\n});"}]},

{"n": "$.ajax(url,[settings])", "b": "通过 HTTP 请求加载远程数据。", "r": "XMLHttpRequest", "d": "jQuery 底层 AJAX 实现。简单易用的高层实现见 $.get, $.post 等。$.ajax() 返回其创建的 XMLHttpRequest 对象。大多数情况下你无需直接操作该函数，除非你需要操作不常用的选项，以获得更多的灵活性。\n最简单的情况下，$.ajax()可以不带任何参数直接使用。\n注意，所有的选项都可以通过$.ajaxSetup()函数来全局设置。\n回调函数\n如果要处理$.ajax()得到的数据，则需要使用回调函数。beforeSend、error、dataFilter、success、complete。\nbeforeSend 在发送请求之前调用，并且传入一个XMLHttpRequest作为参数。\nerror 在请求出错时调用。传入XMLHttpRequest对象，描述错误类型的字符串以及一个异常对象（如果有的话）\ndataFilter 在请求成功之后调用。传入返回的数据以及\"dataType\"参数的值。并且必须返回新的数据（可能是处理过的）传递给success回调函数。\nsuccess 当请求之后调用。传入返回后的数据，以及包含成功代码的字符串。\ncomplete 当请求完成之后调用这个函数，无论成功或失败。传入XMLHttpRequest对象，以及一个包含成功或错误代码的字符串。\n数据类型\n$.ajax()函数依赖服务器提供的信息来处理返回的数据。如果服务器报告说返回的数据是XML，那么返回的结果就可以用普通的XML方法或者jQuery的选择器来遍历。如果见得到其他类型，比如HTML，则数据就以文本形式来对待。\n通过dataType选项还可以指定其他不同数据处理方式。除了单纯的XML，还可以指定 html、json、jsonp、script或者text。\n其中，text和xml类型返回的数据不会经过处理。数据仅仅简单的将XMLHttpRequest的responseText或responseHTML属性传递给success回调函数，\n'''注意'''，我们必须确保网页服务器报告的MIME类型与我们选择的dataType所匹配。比如说，XML的话，服务器端就必须声明 text/xml 或者 application/xml 来获得一致的结果。\n如果指定为html类型，任何内嵌的JavaScript都会在HTML作为一个字符串返回之前执行。类似的，指定script类型的话，也会先执行服务器端生成JavaScript，然后再把脚本作为一个文本数据返回。\n如果指定为json类型，则会把获取到的数据作为一个JavaScript对象来解析，并且把构建好的对象作为结果返回。为了实现这个目的，他首先尝试使用JSON.parse()。如果浏览器不支持，则使用一个函数来构建。JSON数据是一种能很方便通过JavaScript解析的结构化数据。如果获取的数据文件存放在远程服务器上（域名不同，也就是跨域获取数据），则需要使用jsonp类型。使用这种类型的话，会创建一个查询字符串参数 callback=? ，这个参数会加在请求的URL后面。服务器端应当在JSON数据前加上回调函数名，以便完成一个有效的JSONP请求。如果要指定回调函数的参数名来取代默认的callback，可以通过设置$.ajax()的jsonp参数。\n注意，JSONP是JSON格式的扩展。他要求一些服务器端的代码来检测并处理查询字符串参数。更多信息可以参阅 最初的文章。\n如果指定了script或者jsonp类型，那么当从服务器接收到数据时，实际上是用了&lt;script&gt;标签而不是XMLHttpRequest对象。这种情况下，$.ajax()不再返回一个XMLHttpRequest对象，并且也不会传递事件处理函数，比如beforeSend。\n发送数据到服务器\n默认情况下，Ajax请求使用GET方法。如果要使用POST方法，可以设定type参数值。这个选项也会影响data选项中的内容如何发送到服务器。\ndata选项既可以包含一个查询字符串，比如 key1=value1&amp;key2=value2 ，也可以是一个映射，比如 {key1: 'value1', key2: 'value2'} 。如果使用了后者的形式，则数据再发送器会被转换成查询字符串。这个处理过程也可以通过设置processData选项为false来回避。如果我们希望发送一个XML对象给服务器时，这种处理可能并不合适。并且在这种情况下，我们也应当改变contentType选项的值，用其他合适的MIME类型来取代默认的 application/x-www-form-urlencoded 。\n高级选项\nglobal选项用于阻止响应注册的回调函数，比如.ajaxSend，或者ajaxError，以及类似的方法。这在有些时候很有用，比如发送的请求非常频繁且简短的时候，就可以在ajaxSend里禁用这个。更多关于这些方法的详细信息，请参阅下面的内容。\n如果服务器需要HTTP认证，可以使用用户名和密码可以通过username和password选项来设置。\nAjax请求是限时的，所以错误警告被捕获并处理后，可以用来提升用户体验。请求超时这个参数通常就保留其默认值，要不就通过jQuery.ajaxSetup来全局设定，很少为特定的请求重新设置timeout选项。\n默认情况下，请求总会被发出去，但浏览器有可能从他的缓存中调取数据。要禁止使用缓存的结果，可以设置cache参数为false。如果希望判断数据自从上次请求后没有更改过就报告出错的话，可以设置ifModified为true。\nscriptCharset允许给&lt;script&gt;标签的请求设定一个特定的字符集，用于script或者jsonp类似的数据。当脚本和页面字符集不同时，这特别好用。\nAjax的第一个字母是asynchronous的开头字母，这意味着所有的操作都是并行的，完成的顺序没有前后关系。$.ajax()的async参数总是设置成true，这标志着在请求开始后，其他代码依然能够执行。强烈不建议把这个选项设置成false，这意味着所有的请求都不再是异步的了，这也会导致浏览器被锁死。\n$.ajax函数返回他创建的XMLHttpRequest对象。通常jQuery只在内部处理并创建这个对象，但用户也可以通过xhr选项来传递一个自己创建的xhr对象。返回的对象通常已经被丢弃了，但依然提供一个底层接口来观察和操控请求。比如说，调用对象上的.abort()可以在请求完成前挂起请求。", "par": [["url,[settings]", "Object", "V1.5", "url:一个用来包含发送请求的URL字符串。"], ["accepts", "Map", "", "默认： 取决于数据类型。"]], "ex": [{"d": "加载并执行一个 JS 文件。", "j": "$.ajax({\ntype: \"GET\",\nurl: \"test.js\",\ndataType: \"script\"\n});"}, {"d": "保存数据到服务器，成功时显示信息。", "j": "$.ajax({\ntype: \"POST\",\nurl: \"some.php\",\ndata: \"name=John&location=Boston\",\nsuccess: function(msg){\nalert( \"Data Saved: \" + msg );\n}\n});"}, {"d": "装入一个 HTML 网页最新版本。", "j": "$.ajax({\nurl: \"test.html\",\ncache: false,\nsuccess: function(html){\n$(\"#results\").append(html);\n}\n});"}, {"d": "同步加载数据。发送请求时锁住浏览器。需要锁定用户交互操作时使用同步方式。", "j": "var html = $.ajax({\nurl: \"some.php\",\nasync: false\n}).responseText;"}, {"d": "发送 XML 数据至服务器。设置 processData 选项为 false，防止自动转换数据格式。", "j": "var xmlDocument = [create xml document];\n$.ajax({\nurl: \"page.php\",\nprocessData: false,\ndata: xmlDocument,\nsuccess: handleResponse\n});"}]},

{"n": "$.sub()", "b": "可创建一个新的jQuery副本，不影响原有的jQuery对像。", "r": "jQuery", "v": "1.9-", "d": "有两个具体使用jQuery.sub（）创建案例。首先是提供完全没有破坏jQuery原有一切的方法，另一个用于帮助做jQuery插件封装和基本命名空间。\n请注意，jQuery.sub（）不会做任何特殊的隔离 - 这不是它的意图。所有关于jQuery的sub'd版本的方法将仍然指向原来的jQuery。（绑定和触发仍将通过主jQuery的事件，数据将通过主绑定的元素的jQuery，Ajax的查询和活动将通过主jQuery的运行，等等）。\n请注意，如果你正在寻找使用这个开发插件，应首先认真考虑使用一些类似jQuery UI widget工厂，这两个状态和插件管理子方法。 使用jQuery UI widget的一些例子建立一个插件。\n这种方法的具体使用情况下可以通过一些例子最好的描述。\n该方法是在jQuery 1.5中引入的，但是被证明不是很有用，将被移到jQuery 1.9兼容性插件中。", "ex": [{"d": "添加一个jQuery的方法，以便它不会受到外部分：", "j": "(function(){\nvar sub$ = jQuery.sub();\nsub$.fn.myCustomMethod = function(){\nreturn 'just for me';\n};\nsub$(document).ready(function() {\nsub$('body').myCustomMethod() // 'just for me'\n});\n})();\ntypeof jQuery('body').myCustomMethod // undefined"}, {"d": "改写一些jQuery的方法，以提供新的功能。", "j": "(function() {\nvar myjQuery = jQuery.sub();\nmyjQuery.fn.remove = function() {\n// New functionality: Trigger a remove event\nthis.trigger(\"remove\");\n// Be sure to call the original jQuery remove method\nreturn jQuery.fn.remove.apply( this, arguments );\n};\nmyjQuery(function($) {\n$(\".menu\").click(function() {\n$(this).find(\".submenu\").remove();\n});\n// A new remove event is now triggered from this copy of jQuery\n$(document).bind(\"remove\", function(e) {\n$(e.target).parent().hide();\n});\n});\n})();\n// Regular jQuery doesn't trigger a remove event when removing an element\n// This functionality is only contained within the modified 'myjQuery'."}, {"d": "创建一个插件，它返回插件的具体办法。", "j": "(function() {\n// Create a new copy of jQuery using sub()\nvar plugin = jQuery.sub();\n// Extend that copy with the new plugin methods\nplugin.fn.extend({\nopen: function() {\nreturn this.show();\n},\nclose: function() {\nreturn this.hide();\n}\n});\n// Add our plugin to the original jQuery\njQuery.fn.myplugin = function() {\nthis.addClass(\"plugin\");\n// Make sure our plugin returns our special plugin version of jQuery\nreturn plugin( this );\n};\n})();\n$(document).ready(function() {\n// Call the plugin, open method now exists\n$('#main').myplugin().open();\n// Note: Calling just $(\"#main\").open() won't work as open doesn't exist!\n});"}]},

{"n": "deferred.done(doneCallbacks[,doneCallbacks])", "b": "当延迟成功时调用一个函数或者数组函数.。", "r": "Deferred Object", "d": "该参数可以是一个函数或一个函数的数组。当延迟成功时，doneCallbacks被调用。回调执行是依照他们添加的顺序。一旦deferred.done()返回延迟对象，延迟对象的其它方法也可以链接到了这里，包括增加.done()方法。当延迟解决，doneCallbacks执行使用参数提供给resolve或resolveWith方法依照添加的顺序调用。有关详细信息，请参阅Deferred object 。", "par": [["doneCallbacks", "Function/Array", "V1.5", "一个函数或者数组函数，延迟成功时调用"]], "ex": [{"d": "一旦jQuery.get方法返回一个来自延迟的对象的jqXHR对象，我们可以附加一个成功回调使用.done方法。", "j": "$.get(\"test.php\").done(function() {\nalert(\"$.get succeeded\");\n});"}]},

{"n": "def.isRejected()", "b": "确定延迟对象是否已被拒绝。", "r": "Boolean", "v": "1.7-", "d": "注意：jquery1.7API中已弃用，请用deferred.state()替代。\n如果延迟对象是在被拒绝的状态则返回true，这意味着要么deferred.reject()或者deferred.rejectWith()被调用的对象和failCallbacks被访问（或称正在这一进程中的）。\n请注意，延迟的对象可以有三种状态：未解决（unresolved），解决（resolved），或拒绝（rejected）;使用deferred.isResolved()来判断延迟对象是否在解决状态 。这些方法主要用于调试时非常有用，例如，以确定是否递延已经解决，即使你在代码中打算拒绝。"},

"], ["x|y", "匹配x或y。例如，“z|food”能匹配“z”或“food”。“(z|f)ood”则匹配“zood”或“food”。"], ["[xyz]", "字符集合。匹配所包含的任意一个字符。例如，“[abc]”可以匹配“plain”中的“a”。"], ["[^xyz]", "负值字符集合。匹配未包含的任意字符。例如，“[^abc]”可以匹配“plain”中的“p”。"], ["[a-z]", "字符范围。匹配指定范围内的任意字符。例如，“[a-z]”可以匹配“a”到“z”范围内的任意小写字母字符。"], ["[^a-z]", "负值字符范围。匹配任何不在指定范围内的任意字符。例如，“[^a-z]”可以匹配任何不在“a”到“z”范围内的任意字符。"], ["\\b", "匹配一个单词边界，也就是指单词和空格间的位置。例如，“er\\b”可以匹配“never”中的“er”，但不能匹配“verb”中的“er”。"], ["\\B", "匹配非单词边界。“er\\B”能匹配“verb”中的“er”，但不能匹配“never”中的“er”。"], ["\\cx", "匹配由x指明的控制字符。例如，\\cM匹配一个Control-M或回车符。x的值必须为A-Z或a-z之一。否则，将c视为一个原义的“c”字符。"], ["\\d", "匹配一个数字字符。等价于[0-9]。"], ["\\D", "匹配一个非数字字符。等价于[^0-9]。"], ["\\f", "匹配一个换页符。等价于\\x0c和\\cL。"], ["\\n", "匹配一个换行符。等价于\\x0a和\\cJ。"], ["\\r", "匹配一个回车符。等价于\\x0d和\\cM。"], ["\\s", "匹配任何空白字符，包括空格、制表符、换页符等等。等价于[ \\f\\n\\r\\t\\v]。"], ["\\S", "匹配任何非空白字符。等价于[^ \\f\\n\\r\\t\\v]。"], ["\\t", "匹配一个制表符。等价于\\x09和\\cI。"], ["\\v", "匹配一个垂直制表符。等价于\\x0b和\\cK。"], ["\\w", "匹配包括下划线的任何单词字符。等价于“[A-Za-z0-9_]”。"], ["\\W", "匹配任何非单词字符。等价于“[^A-Za-z0-9_]”。"], ["\\xn", "匹配n，其中n为十六进制转义值。十六进制转义值必须为确定的两个数字长。例如，“\\x41”匹配“A”。“\\x041”则等价于“\\x04&1”。正则表达式中可以使用ASCII编码。."], ["\\num", "匹配num，其中num是一个正整数。对所获取的匹配的引用。例如，“(.)\\1”匹配两个连续的相同字符。"], ["\\n", "标识一个八进制转义值或一个向后引用。如果\\n之前至少n个获取的子表达式，则n为向后引用。否则，如果n为八进制数字（0-7），则n为一个八进制转义值。"], ["\\nm", "标识一个八进制转义值或一个向后引用。如果\\nm之前至少有nm个获得子表达式，则nm为向后引用。如果\\nm之前至少有n个获取，则n为一个后跟文字m的向后引用。如果前面的条件都不满足，若n和m均为八进制数字（0-7），则\\nm将匹配八进制转义值nm。"], ["\\nml", "如果n为八进制数字（0-3），且m和l均为八进制数字（0-7），则匹配八进制转义值nml。"], ["\\un", "匹配n，其中n是一个用四个十六进制数字表示的Unicode字符。例如，\\u00A9匹配版权符号（©）。"], ["用户名", "/^[a-z0-9_-]{3,16}$/"], ["密码", "/^[a-z0-9_-]{6,18}$/"], ["十六进制值", "/^#?([a-f0-9]{6}|[a-f0-9]{3})$/"], ["电子邮箱", "/^([a-z0-9_\\.-]+)@([\\da-z\\.-]+)\\.([a-z\\.]{2,6})$/\n/^[a-z\\d]+(\\.[a-z\\d]+)*@([\\da-z](-[\\da-z])?)+(\\.{1,2}[a-z]+)+$/"], ["URL", "/^(https?:\\/\\/)?([\\da-z\\.-]+)\\.([a-z\\.]{2,6})([\\/\\w \\.-]*)*\\/?$/"], ["IP 地址", "/((2[0-4]\\d|25[0-5]|[01]?\\d\\d?)\\.){3}(2[0-4]\\d|25[0-5]|[01]?\\d\\d?)/\n/^(?:(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\ /* ============================================================
   jQuery 在线速查手册 · 交互逻辑
   - 数据来自 categories.js / data-*.js（classic script，支持 file:// 直开）
   - 分区按屏幕宽度自动分配到 N 栏，尽量等高
   ============================================================ */
(function () {
  'use strict';

  /* ---------- 1. 合并数据 ----------
     注意：data-*.js 里用的是 const 声明，const 不会成为 window 的属性，
     所以这里必须用「裸标识符」组装映射表，不能用 window[key] 去取。 */
  var DATA = {
    CORE: CORE, ATTR: ATTR, JQCSS: JQCSS, SELECTOR: SELECTOR,
    MANIP: MANIP, TRAVERSING: TRAVERSING, EVENTS: EVENTS, EFFECTS: EFFECTS,
    AJAX: AJAX, UTIL: UTIL, EVENTOBJ: EVENTOBJ, DEFERRED: DEFERRED,
    CALLBACKS: CALLBACKS, OTHER: OTHER
  };

  var SECS = SECTIONS.map(function (s) {
    return {
      id: s.id,
      name: s.name,
      items: (DATA[s.key] || []).slice(),
      note: SECTION_NOTES[s.id] || ''
    };
  });
  var TOTAL = SECS.reduce(function (n, s) { return n + s.items.length; }, 0);

  /* 给每条生成唯一锚点 id（便于分享链接） */
  var usedId = {};
  SECS.forEach(function (s) {
    s.items.forEach(function (it, i) {
      var base = String(it.n).toLowerCase()
        .replace(/[^\p{L}\p{N}]+/gu, '-')
        .replace(/^-+|-+$/g, '') || (s.id + '-' + i);
      if (usedId[base]) { usedId[base]++; base = base + '-' + usedId[base]; }
      else { usedId[base] = 1; }
      it._id = base;
    });
  });

  /* 预先把可搜索文本拼好（名称 + 解释 + 说明 + 参数 + 示例描述），
     否则每次输入都要重新拼 294 条 */
  SECS.forEach(function (s) {
    s.items.forEach(function (it) {
      var t = it.n + ' ' + it.b + ' ' + (it.d || '');
      (it.par || []).forEach(function (p) { t += ' ' + p[0] + ' ' + p[1] + ' ' + p[3]; });
      (it.ex || []).forEach(function (e) { t += ' ' + (e.d || ''); });
      it._s = t.toLowerCase();
    });
  });

  /* ---------- 2. 小工具 ---------- */
  function esc(s) {
    return String(s).replace(/[&<>]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c];
    });
  }
  function hit(text, q) { return '<span class="hit">' + text + '</span>'; }
  function mark(text, q) {
    var t = esc(text);
    if (!q) return t;
    var lower = t.toLowerCase(), ql = esc(q).toLowerCase(), out = '', pos = 0, idx;
    if (!ql) return t;
    while ((idx = lower.indexOf(ql, pos)) !== -1) {
      out += t.slice(pos, idx) + hit(t.slice(idx, idx + ql.length));
      pos = idx + ql.length;
    }
    return out + t.slice(pos);
  }

  /* ---------- 3. 轻量 JavaScript / HTML 语法高亮 ---------- */
  var JS_KW = ('break case catch class const continue debugger default delete do else export extends '
    + 'finally for function if import in instanceof let new of return static super switch this throw '
    + 'try typeof var void while with yield await async true false null undefined').split(' ');
  var JS_BI = ('jQuery $ window document console Math JSON Object Array String Number Boolean Date RegExp '
    + 'Error setTimeout setInterval clearTimeout clearInterval parseInt parseFloat isNaN alert confirm prompt '
    + 'encodeURIComponent decodeURIComponent').split(' ');
  var KW = {}, BI = {};
  JS_KW.forEach(function (k) { KW[k] = 1; });
  JS_BI.forEach(function (k) { BI[k] = 1; });

  function highlight(code) {
    var out = '', i = 0, n = code.length, j, ch, w, cls, prev;
    while (i < n) {
      ch = code[i];

      if (ch === '/' && code[i + 1] === '/') {             /* 行注释 */
        j = code.indexOf('\n', i); if (j < 0) j = n;
        out += '<span class="cm">' + esc(code.slice(i, j)) + '</span>';
        i = j; continue;
      }

      if (ch === '/' && code[i + 1] === '*') {             /* 块注释 */
        j = code.indexOf('*/', i + 2); j = (j < 0 ? n : j + 2);
        out += '<span class="cm">' + esc(code.slice(i, j)) + '</span>';
        i = j; continue;
      }

      if (ch === '"' || ch === "'" || ch === '`') {        /* 字符串（含模板串） */
        j = i + 1;
        while (j < n) {
          if (code[j] === '\\') { j += 2; continue; }
          if (code[j] === ch) { j++; break; }
          if (code[j] === '\n' && ch !== '`') break;
          j++;
        }
        out += '<span class="st">' + esc(code.slice(i, j)) + '</span>';
        i = j; continue;
      }

      if (/[0-9]/.test(ch) && !/[A-Za-z0-9_$.]/.test(code[i - 1] || '')) {   /* 数字 */
        j = i; while (j < n && /[0-9a-fA-FxXoObBeE._]/.test(code[j])) j++;
        out += '<span class="fs">' + code.slice(i, j) + '</span>';
        i = j; continue;
      }

      if (/[A-Za-z_$]/.test(ch)) {                         /* 名字（含 $ / jQuery） */
        j = i; while (j < n && /[A-Za-z0-9_$]/.test(code[j])) j++;
        w = code.slice(i, j);
        prev = code.slice(0, i).replace(/\s+$/, '').slice(-1);
        cls = null;
        if (KW[w]) cls = 'kw';
        else if (prev === '.') cls = 'fs';
        else if (BI[w]) cls = 'bu';
        else if (code[j] === '(') cls = 'nm';
        out += cls ? '<span class="' + cls + '">' + esc(w) + '</span>' : esc(w);
        i = j; continue;
      }

      if ('+-*/%=<>!&|^~?:'.indexOf(ch) > -1) {            /* 运算符 */
        out += '<span class="op">' + esc(ch) + '</span>';
        i++; continue;
      }

      out += esc(ch); i++;
    }
    return out;
  }

  /* HTML 代码块：标出标签名 / 属性名 / 属性值 / 注释，其余原样输出。
     注意结尾的空白必须并进捕获组 m[3] 一起输出 —— 写成 `\s*(\/?)>`
     会把 <input ... /> 里 /> 前的空格吃掉，导致代码块比原文少字符。 */
  var HTML_TAG = /<!--[\s\S]*?-->|<\/?([A-Za-z][\w:-]*)((?:\s+[\w:-]+(?:\s*=\s*(?:"[^"]*"|'[^']*'|[^\s"'>]+))?)*)(\s*\/?)>/g;

  function highlightHtml(code) {
    var out = '', last = 0, m;
    HTML_TAG.lastIndex = 0;
    while ((m = HTML_TAG.exec(code)) !== null) {
      out += esc(code.slice(last, m.index));
      if (m[0].slice(0, 4) === '<!--') {
        out += '<span class="cm">' + esc(m[0]) + '</span>';
      } else {
        out += esc(/^<\/?/.exec(m[0])[0]) + '<span class="tg">' + esc(m[1]) + '</span>';
        out += esc(m[2]).replace(/([\w:-]+)(\s*=\s*)("[^"]*"|'[^']*'|[^\s>]+)?/g,
          function (s, an, eq, av) {
            return '<span class="at">' + an + '</span>' + eq
              + (av ? '<span class="av">' + av + '</span>' : '');
          });
        out += esc(m[3]) + '>';
      }
      last = HTML_TAG.lastIndex;
    }
    return out + esc(code.slice(last));
  }

  /* ---------- 4. 渲染分区与条目 ---------- */
  var colsEl = document.getElementById('cols');
  var secEls = [];       /* 分区 DOM */
  var itemEls = [];      /* itemEls[si][i] = <li> */

  function itemHtml(secId, idx, it) {
    var h = '<li class="item" id="' + it._id + '" data-sec="' + secId + '" data-i="' + idx + '">';
    h += '<a class="fn" role="button" tabindex="0" aria-expanded="false">' + mark(it.n, state.q) + '</a> ';
    h += '<span class="ds">' + mark(it.b, state.q) + '</span>';

    h += '<div class="det">';
    if (it.d) h += '<p><span class="lbl">说明：</span>' + mark(it.d, state.q) + '</p>';
    var meta = [];
    if (it.r) meta.push('返回值：<code>' + esc(it.r) + '</code>');
    if (it.v) meta.push('版本：<code>' + esc(it.v) + '</code>');
    if (meta.length) h += '<p class="meta">' + meta.join(' &nbsp;·&nbsp; ') + '</p>';

    /* 参数表：[参数名, 类型, 版本, 说明] */
    if (it.par && it.par.length) {
      h += '<table class="par"><tr><th style="width:32%">参数</th>'
        + '<th style="width:22%">类型</th><th>说明</th></tr>';
      it.par.forEach(function (p) {
        h += '<tr><td><code>' + esc(p[0]) + '</code>'
          + (p[2] ? '<em>' + esc(p[2]) + '</em>' : '') + '</td><td>' + esc(p[1] || '') + '</td>'
          + '<td>' + mark(p[3] || '', state.q) + '</td></tr>';
      });
      h += '</table>';
    }

    /* 附加的整张速查表（jQuery 手册里的正则表达式） */
    if (it.T && it.T.length) {
      h += '<table class="tb"><tr><th>字符</th><th>说明</th></tr>';
      it.T.forEach(function (row) {
        h += '<tr><td>' + esc(row[0]) + '</td><td>' + mark(row[1], state.q) + '</td></tr>';
      });
      h += '</table>';
    }

    /* 示例：一条 API 常有多个，按「HTML 代码 / jQuery 代码 / 结果」分段 */
    if (it.ex && it.ex.length) {
      it.ex.forEach(function (ex, i) {
        h += '<div class="ex">';
        h += '<p class="exhd">' + (it.ex.length > 1
          ? '<span class="exNum">示例 ' + (i + 1) + '</span>' : '')
          + mark(ex.d || '示例', state.q) + '</p>';
        if (ex.h) h += '<p class="exhd">HTML 代码</p><pre>' + highlightHtml(ex.h) + '</pre>';
        if (ex.c) h += '<p class="exhd">CSS 代码</p><pre>' + highlight(ex.c) + '</pre>';
        if (ex.j) h += '<p class="exhd">jQuery 代码</p><pre>' + highlight(ex.j) + '</pre>';
        if (ex.s) h += '<p class="exhd">JS 代码</p><pre>' + highlight(ex.s) + '</pre>';
        if (ex.r) h += '<p class="exhd">结果</p><pre class="res">' + esc(ex.r) + '</pre>';
        h += '</div>';
      });
    } else if (it.e) {
      h += '<pre>' + highlight(it.e) + '</pre>';
    }
    h += '</div></li>';
    return h;
  }

  function buildSections() {
    SECS.forEach(function (sec, si) {
      var el = document.createElement('div');
      el.className = 'sec';
      el.id = 's-' + sec.id;

      var html = '<h1>' + esc(sec.name) + '</h1><ul>';
      sec.items.forEach(function (it, i) { html += itemHtml(sec.id, i, it); });
      if (sec.note) html += '<li class="note">' + esc(sec.note) + '</li>';
      html += '</ul>';

      el.innerHTML = html;
      secEls.push(el);
      itemEls.push(Array.prototype.slice.call(el.querySelectorAll('li.item')));
    });
  }

  /* ---------- 5. 分栏 ----------
     要求「分区顺序不能乱」，同时四栏尽量等高。
     贪心（每次塞最矮的一栏）会被内置函数这种超长分区带偏，
     所以这里先量高度，再用动态规划求「保序切成 k 段、使最高的一段最矮」的最优解。 */
  /* 栏数按「可用内容宽度」而不是窗口宽度算：
     窄屏断点会把左栏从侧边挪到顶部，同一个窗口宽度下内容宽度差很多，
     用 window.innerWidth 会在断点附近突然挤出过窄的栏。 */
  function contentWidth() {
    var el = document.getElementById('content');
    return el ? el.clientWidth : window.innerWidth;
  }

  function columnCount() {
    var w = contentWidth();
    if (w >= 1000) return 4;   /* 原站 .col{width:24%} 在桌面端恒定四栏，这里跟到约 242px/栏 */
    if (w >= 760) return 3;
    if (w >= 520) return 2;
    return 1;
  }

  /* 把数组 w 按原顺序切成 k 段，让「段和的最大值」最小。返回每段的起止下标。 */
  function bestPartition(w, k) {
    var n = w.length;
    if (k > n) k = n;
    var pre = [0], i, j, m;
    for (i = 0; i < n; i++) pre.push(pre[i] + w[i]);
    var INF = Infinity;
    var dp = [], cut = [];
    for (j = 0; j <= k; j++) {
      dp.push(new Array(n + 1).fill(INF));
      cut.push(new Array(n + 1).fill(0));
    }
    dp[0][0] = 0;
    for (j = 1; j <= k; j++) {
      for (i = j; i <= n; i++) {
        for (m = j - 1; m < i; m++) {
          var v = Math.max(dp[j - 1][m], pre[i] - pre[m]);
          if (v < dp[j][i]) { dp[j][i] = v; cut[j][i] = m; }
        }
      }
    }
    var groups = [];
    var end = n;
    for (j = k; j >= 1; j--) {
      var st = cut[j][end];
      groups.unshift([st, end]);
      end = st;
    }
    return groups;
  }

  function layout() {
    var n = Math.min(columnCount(), secEls.length || 1);

    colsEl.innerHTML = '';
    var cols = [];
    for (var i = 0; i < n; i++) {
      var d = document.createElement('div');
      d.className = 'col';
      colsEl.appendChild(d);
      cols.push(d);
    }

    /* 先把所有分区临时堆在第 1 栏：此时栏宽已是最终宽度，量出来的高度才准 */
    secEls.forEach(function (el) { cols[0].appendChild(el); });
    var heights = secEls.map(function (el) { return el.offsetHeight; });

    var groups = bestPartition(heights, n);
    groups.forEach(function (g, ci) {
      for (var k = g[0]; k < g[1]; k++) cols[ci].appendChild(secEls[k]);
    });
  }

  /* 筛选态专用：只把「还有命中」的分区按原顺序紧凑塞进各栏，
     谁当前最矮就进谁（可见分区通常只有几个，贪心足够了）。
     否则分区会留在原来的栏里，屏幕上到处是空白。 */
  function packVisible() {
    var n = Math.min(columnCount(), secEls.length || 1);
    colsEl.innerHTML = '';
    var cols = [], hs = [];
    for (var i = 0; i < n; i++) {
      var d = document.createElement('div');
      d.className = 'col';
      colsEl.appendChild(d);
      cols.push(d); hs.push(0);
    }
    secEls.filter(function (el) { return !el.classList.contains('js-hide'); })
      .forEach(function (el) {
        cols[0].appendChild(el);                 /* 先借第 1 栏量高（各栏等宽，高度可比） */
        var h = el.offsetHeight;
        var mi = 0;
        for (var k = 1; k < n; k++) { if (hs[k] < hs[mi]) mi = k; }
        cols[mi].appendChild(el);
        hs[mi] += h;
      });
  }

  function relayout() {
    if (state.q && state.q.trim()) packVisible();
    else layout();
  }

  /* ---------- 6. 左侧目录 ---------- */
  var treeEl = document.getElementById('tree');

  function buildTree() {
    var h = '<li class="open"><span class="folder">' +
      '<span class="tri"></span><span class="ico">📁</span>jQuery 在线速查手册</span><ul class="sub">';
    SECS.forEach(function (sec) {
      h += '<li class="node" data-sec="' + sec.id + '"><span class="folder">' +
        '<span class="tri"></span><span class="ico">📂</span>' +
        '<a class="sec-link" href="#s-' + sec.id + '">' + esc(sec.name) + '</a></span>';
      h += '<ul class="sub">';
      sec.items.forEach(function (it, i) {
        /* 带上 data-i：过滤时按它取数据，不依赖「第几个链接」这种位置关系 */
        h += '<li><a href="#' + it._id + '" data-i="' + i + '" data-sec="' + sec.id + '">' + esc(it.n) + '</a></li>';
      });
      h += '</ul></li>';
    });
    h += '</ul></li>';
    treeEl.innerHTML = h;
  }

  treeEl.addEventListener('click', function (e) {
    var a = e.target.closest('a');
    if (a) return;                       /* 条目链接交给 hashchange 处理 */
    var folder = e.target.closest('.folder');
    if (!folder) return;
    folder.parentElement.classList.toggle('open');
  });

  document.getElementById('expandAll').addEventListener('click', function () {
    setAll(true);
  });
  document.getElementById('collapseAll').addEventListener('click', function () {
    setAll(false);
  });

  function setAll(open) {
    Array.prototype.forEach.call(treeEl.querySelectorAll('li.node'), function (li) {
      li.classList.toggle('open', open);
    });
    Array.prototype.forEach.call(document.querySelectorAll('li.item'), function (li) {
      li.classList.toggle('open', open);
      var fn = li.querySelector('.fn');
      if (fn) fn.setAttribute('aria-expanded', open ? 'true' : 'false');
    });
    /* 全部折叠时顺手把滚动条带回顶部，避免停在半路 */
    if (!open) window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  /* ---------- 7. 搜索 ---------- */
  var searchEl = document.getElementById('search');
  var clearEl = document.getElementById('clearSearch');
  var noResultEl = document.getElementById('noResult');
  var madebyEl = document.getElementById('madeby');
  var state = { q: '' };
  var lastQ = null;

  function applyFilter() {
    var q = state.q.trim();
    var ql = q.toLowerCase();
    var shown = 0;

    SECS.forEach(function (sec, si) {
      var visible = 0;
      sec.items.forEach(function (it, i) {
        var li = itemEls[si][i];
        var ok = !ql || it._s.indexOf(ql) > -1;
        li.classList.toggle('js-hide', !ok);
        if (ok) {
          visible++;
          if (q !== lastQ) {
            li.querySelector('.fn').innerHTML = mark(it.n, q);
            li.querySelector('.ds').innerHTML = mark(it.b, q);
          }
        }
      });
      secEls[si].classList.toggle('js-hide', visible === 0);
      var note = secEls[si].querySelector('.note');
      if (note) note.classList.toggle('js-hide', !!ql);
      shown += visible;
    });

    /* 左侧目录同步过滤
       注意：必须用 a[data-i] 而不是 '.sub a'——querySelectorAll 的「祖先部分」
       不受调用元素限制（.sub 只要在文档里任一祖先位置即可），会把根节点的
       分区链接也匹配进来，导致下标越界。 */
    Array.prototype.forEach.call(treeEl.querySelectorAll('li.node'), function (node) {
      var secId = node.getAttribute('data-sec'), sec = null;
      for (var k = 0; k < SECS.length; k++) { if (SECS[k].id === secId) { sec = SECS[k]; break; } }
      var keep = 0;
      Array.prototype.forEach.call(node.querySelectorAll('a[data-i]'), function (a) {
        var it = sec ? sec.items[+a.getAttribute('data-i')] : null;
        var ok = !!it && (!ql || it._s.indexOf(ql) > -1);
        a.parentElement.classList.toggle('js-hide', !ok);
        if (ok) keep++;
      });
      node.classList.toggle('js-hide', keep === 0);
    });

    noResultEl.hidden = shown > 0;
    if (q !== lastQ) {
      madebyEl.innerHTML = ql
        ? '命中 <b>' + shown + '</b> / ' + TOTAL + ' 条'
        : '共 <b>' + TOTAL + '</b> 条 · 点击名称展开说明与示例';
    }
    lastQ = q;

    /* 命中集合变了就要重排：筛选时紧凑打包，清空后回到 DP 均衡分栏 */
    relayout();
  }

  var timer = null;
  searchEl.addEventListener('input', function () {
    clearEl.hidden = !searchEl.value;
    clearTimeout(timer);
    timer = setTimeout(function () {
      state.q = searchEl.value;
      applyFilter();
      if (state.q.trim()) window.scrollTo({ top: 0, behavior: 'smooth' });
    }, 140);
  });
  clearEl.addEventListener('click', function () {
    searchEl.value = ''; state.q = ''; clearEl.hidden = true;
    applyFilter(); searchEl.focus();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === '/' && document.activeElement !== searchEl) {
      e.preventDefault(); searchEl.focus(); searchEl.select();
    }
    if (e.key === 'Escape' && document.activeElement === searchEl) {
      searchEl.value = ''; state.q = ''; clearEl.hidden = true; applyFilter(); searchEl.blur();
    }
  });

  /* ---------- 8. 点击条目展开说明 / 示例 ---------- */
  function toggleItem(li) {
    li.classList.toggle('open');
    var fn = li.querySelector('.fn');
    if (fn) fn.setAttribute('aria-expanded', li.classList.contains('open') ? 'true' : 'false');
    if (li.classList.contains('open')) {
      history.replaceState(null, '', '#' + li.id);
    }
  }

  colsEl.addEventListener('click', function (e) {
    var fn = e.target.closest('.fn');
    if (!fn) return;
    toggleItem(fn.parentElement);
  });

  /* 键盘可达：Enter / 空格 与点击等价（.fn 是无 href 的 <a>，默认不可聚焦，靠 tabindex 兜住） */
  colsEl.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter' && e.key !== ' ' && e.key !== 'Spacebar') return;
    var fn = e.target.closest('.fn');
    if (!fn) return;
    e.preventDefault();
    toggleItem(fn.parentElement);
  });

  /* ---------- 9. 锚点定位 ---------- */
  function scrollToEl(el, offset) {
    var y = el.getBoundingClientRect().top + window.scrollY - (offset || 10);
    var start = window.scrollY;
    try { window.scrollTo({ top: y, behavior: 'smooth' }); }
    catch (err) { window.scrollTo(0, y); }
    setTimeout(function () {
      if (Math.abs(window.scrollY - start) < 4 && Math.abs(start - y) > 4) window.scrollTo(0, y);
    }, 420);
  }

  function gotoHash() {
    var id = decodeURIComponent(location.hash.replace(/^#/, ''));
    if (!id) return;

    /* 原站 dtree 的选中态：同一时刻只高亮一个节点 */
    Array.prototype.forEach.call(treeEl.querySelectorAll('a.sel'), function (a) {
      a.classList.remove('sel');
    });
    var sel = null;

    /* 分区标题 */
    var sec = document.getElementById(id);
    if (sec && sec.classList.contains('sec')) {
      sel = treeEl.querySelector('a.sec-link[href="#' + id + '"]');
      sec.classList.add('flash');
      scrollToEl(sec, 8);
      setTimeout(function () { sec.classList.remove('flash'); }, 1500);
      if (sel) sel.classList.add('sel');
      return;
    }
    /* 具体条目 */
    var li = document.getElementById(id);
    if (li && li.classList.contains('item')) {
      li.classList.add('open');
      var fnEl = li.querySelector('.fn');
      if (fnEl) fnEl.setAttribute('aria-expanded', 'true');
      /* 展开所在分区目录 */
      var si = SECS.findIndex(function (s) { return s.id === li.getAttribute('data-sec'); });
      if (si > -1) {
        var node = treeEl.querySelectorAll('li.node')[si];
        if (node) node.classList.add('open');
      }
      sel = treeEl.querySelector('a[data-sec="' + li.getAttribute('data-sec') + '"][data-i="' + li.getAttribute('data-i') + '"]');
      if (sel) sel.classList.add('sel');
      scrollToEl(li, 12);
      li.style.transition = 'background .3s';
      li.style.background = '#ffe9a8';
      setTimeout(function () { li.style.background = ''; }, 1400);
    }
  }
  window.addEventListener('hashchange', gotoHash);

  /* ---------- 10. 窗口尺寸变化时重新分栏 ---------- */
  var rzTimer = null;
  window.addEventListener('resize', function () {
    clearTimeout(rzTimer);
    rzTimer = setTimeout(relayout, 160);
  });

  /* ---------- 11. 启动 ---------- */
  buildSections();
  buildTree();
  layout();
  applyFilter();
  if (location.hash) setTimeout(gotoHash, 150);
})();
;
</script>
<script>

(function(){
 'use strict';
 var KW='const|let|var|function|return|if|else|elif|for|in|of|while|break|continue|new|class|extends|import|from|export|default|as|async|await|try|catch|except|finally|raise|with|def|lambda|pass|yield|del|global|nonlocal|assert|this|self|super|typeof|instanceof|void|delete|throw|static|public|private|interface|type|enum|fn|mut|match|where|select|group|order|by|limit|insert|update|create|table|echo|exit|set|call|source|use|package|include|local|readonly|declare|end|then|do|done|fi|case|esac';
 var BI='true|false|null|undefined|None|True|False|NaN|Infinity|document|window|console|Math|JSON|Date|Array|Object|String|Number|Promise|RegExp|ref|reactive|computed|watch|watchEffect|onMounted|onUnmounted|defineProps|defineEmits|defineModel|createApp|axios|localStorage|process|require|module|exports|cls|print|len|range|str|int|float|list|dict|set|tuple|open';
 var RE=new RegExp(
   '(https?://[^\\s"\'<>\x27]+)'+
   '|("(?:\\\\.|[^"\\\\])*"|\x27(?:\\\\.|[^\x27\\\\])*\x27|`(?:\\\\.|[^`\\\\])*`)'+
   '|(<\\/?[A-Za-z][\\w-]*(?:\\s[^<>]*)?\\/?>)'+

   '|(\\.[A-Za-z_$][\\w$]*)'+
   '|([=+\\-*/%<>!&|?:^~]+)'
 ,'g');
 var CLS=['tk-url','tk-str','tk-tag','tk-cmt','tk-opt','tk-num','tk-kw','tk-bi','tk-fn','tk-prop','tk-op'];
 function kind(m){ for(var i=1;i<=CLS.length;i++){ if(m[i]!==undefined) return CLS[i-1]; } return null; }
 function isDark(pre){
   var el=pre,c,m,tries=0;
   while(el&&tries<4){
     c=getComputedStyle(el).backgroundColor;
     m=(c||'').match(/[\d.]+/g);
     if(m&&m.length>=3&&!(m.length>3&&parseFloat(m[3])<0.25)){
       return (0.299*parseFloat(m[0])+0.587*parseFloat(m[1])+0.114*parseFloat(m[2]))<128;
     }
     el=el.parentElement; tries++;
   }
   return false;
 }
 function skip(pre){
   if(pre.hasAttribute('data-hl')) return true;
   if(pre.classList&&pre.classList.contains('output')) return true;
   if(/out/i.test(pre.id||'')) return true;
   var p=pre.parentElement;
   while(p&&p!==document.body){
     if(p.classList&&(p.classList.contains('out')||p.classList.contains('demo')||p.classList.contains('output'))) return true;
     p=p.parentElement;
   }
   return false;
 }
 function paint(node){
   var text=node.nodeValue;
   if(!text||!text.trim()) return;
   var frag=document.createDocumentFragment(),last=0,m,hit=false;
   RE.lastIndex=0;
   while((m=RE.exec(text))!==null){
     if(m[0].length===0){ RE.lastIndex++; continue; }
     if(m.index>last) frag.appendChild(document.createTextNode(text.slice(last,m.index)));
     var sp=document.createElement('span');
     sp.className=kind(m)||'tk-op';
     sp.textContent=m[0];
     frag.appendChild(sp);
     last=m.index+m[0].length; hit=true;
   }
   if(!hit) return;
   if(last<text.length) frag.appendChild(document.createTextNode(text.slice(last)));
   if(node.parentNode) node.parentNode.replaceChild(frag,node);
 }
 var mo=null, pending=false;
 function run(){
   if(mo) mo.disconnect();
   var pres=document.querySelectorAll('pre');
   for(var i=0;i<pres.length;i++){
     var pre=pres[i];
     if(skip(pre)) continue;
     var target=pre;
     if(pre.children.length===1&&pre.firstElementChild&&pre.firstElementChild.tagName==='CODE') target=pre.firstElementChild;
     var nodes=[],n=target.firstChild;
     while(n){ if(n.nodeType===3) nodes.push(n); n=n.nextSibling; }
     for(var j=0;j<nodes.length;j++) paint(nodes[j]);
     if(isDark(pre)) pre.classList.add('hl-dark');
     pre.setAttribute('data-hl','1');
   }
   if(mo) mo.observe(document.body,{childList:true,subtree:true});
 }
 function schedule(){
   if(pending) return;
   pending=true;
   (window.requestAnimationFrame||function(f){setTimeout(f,60);})(function(){ pending=false; run(); });
 }
 run();
 if(window.MutationObserver){
   mo=new MutationObserver(function(muts){
     for(var i=0;i<muts.length;i++){
       var a=muts[i].addedNodes;
       for(var j=0;j<a.length;j++){
         if(a[j].nodeType!==1) continue;
         if(a[j].tagName==='PRE'||(a[j].querySelectorAll&&a[j].querySelectorAll('pre').length)){ schedule(); return; }
       }
     }
   });
   mo.observe(document.body,{childList:true,subtree:true});
