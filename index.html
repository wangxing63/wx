<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>教程资料库</title>
<style>
:root{
  --bg:#f4f6fb; --card:#fff; --ink:#1e293b; --muted:#64748b; --faint:#94a3b8;
  --line:#e7ecf4; --line-soft:#f1f4f9; --hover:#f5f8fd;
  --blue:#2563eb; --blue-deep:#1d4ed8; --blue-bg:#eef4ff; --blue-soft:#f6f9ff;
  --shadow:0 1px 2px rgba(16,35,70,.04), 0 8px 24px rgba(16,35,70,.05);
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:linear-gradient(180deg,#f8faff 0%,#f1f5fb 100%);color:var(--ink);
  font:14px/1.65 var(--sans);-webkit-font-smoothing:antialiased}
.layout{display:flex;gap:12px;height:100vh;padding:12px;align-items:stretch}
.col{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);
  display:flex;flex-direction:column;min-width:0;overflow:hidden}
.col-files{flex:0 0 clamp(196px,15vw,252px)}
.col-outline{flex:0 0 clamp(228px,19vw,310px)}
.col-page{flex:1 1 auto;min-width:0}
.layout.focus .col-files,.layout.focus .col-outline{display:none}
.col-head{flex:0 0 auto;height:60px;display:flex;align-items:center;gap:10px;padding:0 14px;
  border-bottom:1px solid var(--line-soft);background:linear-gradient(180deg,#fff,#fcfdff)}
.head-ico{width:30px;height:30px;flex:0 0 30px;border-radius:9px;background:var(--blue-bg);
  color:var(--blue);display:flex;align-items:center;justify-content:center}
.head-ico svg{width:16px;height:16px;display:block}
.head-txt{min-width:0;flex:1 1 auto;display:flex;flex-direction:column;justify-content:center;line-height:1.35}
.head-txt b{font-size:13.5px;font-weight:700;letter-spacing:.2px;color:#1e293b}
.head-txt small{font-size:11px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.head-badge{flex:0 0 auto;min-width:24px;height:22px;padding:0 7px;border-radius:7px;background:#f1f5fb;
  color:#7c8ba3;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
.head-actions{flex:0 0 auto;display:flex;align-items:center;gap:6px}
.head-btn{flex:0 0 auto;display:flex;align-items:center;gap:5px;height:30px;padding:0 10px;
  border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--muted);
  font:11.5px var(--sans);cursor:pointer;text-decoration:none;transition:.15s}
.head-btn:hover{border-color:#bfd2ff;color:var(--blue);background:var(--blue-soft);text-decoration:none}
.head-btn.on{background:var(--blue-bg);border-color:#bfd2ff;color:var(--blue)}
.head-btn svg{width:13px;height:13px}
.col-body{flex:1 1 auto;overflow-y:auto;padding:10px 10px 16px;
  scrollbar-width:thin;scrollbar-color:#d7dfeb transparent}
.col-body::-webkit-scrollbar{width:9px}
.col-body::-webkit-scrollbar-thumb{background:#dbe2ed;border:3px solid #fff;border-radius:9px}
.col-body::-webkit-scrollbar-thumb:hover{background:#c3cede}
.col-body::-webkit-scrollbar-track{background:transparent}
.page-body{flex:1 1 auto;min-height:0;padding:10px;background:#fbfcfe}
iframe{width:100%;height:100%;border:1px solid var(--line);border-radius:10px;display:block;
  background:#fff;box-shadow:0 1px 3px rgba(16,35,70,.04)}

/* ---------- 左栏：文件列表 ---------- */
.file-item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;position:relative;
  border:1px solid transparent;background:none;padding:9px 10px;border-radius:10px;
  cursor:pointer;color:var(--ink);font:13px/1.4 var(--sans);margin-bottom:3px;transition:.15s}
.file-item:hover{background:var(--hover)}
.file-item.on{background:var(--blue-bg);border-color:#dae6ff}
.file-item.on::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;
  border-radius:0 3px 3px 0;background:var(--blue)}
.fdot{width:28px;height:28px;flex:0 0 28px;border-radius:8px;background:var(--dot);
  display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:800}
.fmeta{min-width:0;flex:1 1 auto;display:flex;flex-direction:column}
.fmeta strong{font-size:12.5px;font-weight:650;color:#25324a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.file-item.on .fmeta strong{color:var(--blue-deep)}
.fmeta small{font-size:10.5px;color:var(--faint);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;margin-top:1px}
.file-item.on .fmeta small{color:#6d8fd8}
.file-count{display:flex;align-items:center;gap:8px;color:var(--faint);font-size:11px;
  padding:14px 6px 2px;margin-top:8px;border-top:1px dashed var(--line)}

/* ---------- 中栏：工具栏与大纲 ---------- */
.outline-tools{flex:0 0 auto;padding:10px 12px;border-bottom:1px solid var(--line-soft);display:flex;gap:8px}
.search-wrap{position:relative;flex:1 1 auto;min-width:0}
.search-wrap svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);width:14px;height:14px;
  color:#a9b6c8;pointer-events:none}
#filter{width:100%;height:32px;border:1px solid var(--line);border-radius:9px;background:#f8fafd;
  padding:0 9px 0 29px;font:12px var(--sans);color:var(--ink);outline:none;transition:.15s}
#filter::placeholder{color:#aab6c6}
#filter:focus{background:#fff;border-color:#a9c4ff;box-shadow:0 0 0 3px rgba(37,99,235,.09)}
#toggleAll{flex:0 0 auto;height:32px;border:1px solid var(--line);background:#fff;border-radius:9px;
  padding:0 10px;font:11.5px var(--sans);color:var(--muted);cursor:pointer;white-space:nowrap;transition:.15s}
#toggleAll:hover{background:var(--blue-soft);border-color:#bfd2ff;color:var(--blue)}
.grp{margin:0 0 10px}
.grp-title{display:flex;align-items:center;gap:7px;cursor:pointer;font-size:11.5px;font-weight:700;
  color:#5b6b85;padding:7px 8px;border-radius:8px;user-select:none;transition:.15s}
.grp-title:hover{background:var(--hover)}
.caret{width:7px;height:7px;flex:0 0 7px;margin-right:2px;cursor:pointer;position:relative;
  border-right:1.6px solid #9aa9bd;border-bottom:1.6px solid #9aa9bd;
  transform:rotate(-45deg);transition:transform .16s}
.caret::after{content:"";position:absolute;inset:-8px}
.caret.open{transform:rotate(45deg)}
.grp-title .gname{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  color:inherit;text-decoration:none;cursor:pointer;letter-spacing:.2px}
.grp-title .gname.glink{color:var(--blue-deep)}
.grp-title .cnt{flex:0 0 auto;min-width:20px;height:18px;padding:0 6px;border-radius:6px;
  background:#f1f5fa;color:#8c9bb0;font-size:10px;font-weight:700;
  display:flex;align-items:center;justify-content:center}
.grp-items{padding-left:6px}
.ol-item{display:block;padding:5px 9px 5px 12px;border-radius:7px;border-left:2px solid transparent;
  color:#55637a;font-size:12.5px;line-height:1.55;cursor:pointer;text-decoration:none;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:.13s;margin:1px 0}
.ol-item:hover{background:var(--hover);color:var(--ink);text-decoration:none}
.ol-item.lv1{padding-left:24px;font-size:11.5px;color:#8a97a9}
.ol-item.on{background:var(--blue-bg);color:var(--blue-deep);font-weight:700;border-left-color:var(--blue)}
.ol-empty{text-align:center;color:var(--faint);font-size:12px;padding:26px 4px}
.loading{color:var(--faint);font-size:12px;text-align:center;padding:12px}

@media (max-width:900px){
  body{overflow:auto}
  .layout{flex-direction:column;height:auto;min-height:100vh;padding:10px;gap:10px}
  .col-files,.col-outline{flex:0 0 auto;max-height:250px}
  .col-page{flex:0 0 auto;height:78vh}
}
</style>
</head>

const DEFAULT_DOC = 'Git.html';

DOCS.forEach(function(d){ byFile[d.file] = d; });

const fileList = document.getElementById('fileList');

const toggleAll= document.getElementById('toggleAll');
const curTitle = document.getElementById('curTitle');

const outlineSub  = document.getElementById('outlineSub');
const outlineCount= document.getElementById('outlineCount');
const openNew     = document.getElementById('openNew');
const fileCount   = document.getElementById('fileCount');
const focusBtn    = document.getElementById('focusBtn');
const focusLabel  = document.getElementById('focusLabel');
const layoutEl    = document.querySelector('.layout');
const DOT_COLORS = ['#3b82f6','#8b5cf6','#ec4899','#f59e0b','#10b981',
                    '#06b6d4','#6366f1','#f97362','#14b8a6','#a855f7'];

let current = null;
let activeAnchor = '';
let collapsed = {};       // 用户手动折叠/展开的分组，覆盖默认 open
let allOpen = false;
let scrollTimer = null;

function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function urlParams(){
  const q = new URLSearchParams(location.search);
  return { f: q.get('f') || '', s: q.get('s') || '', focus: q.get('focus') === '1' };
}
function setUrl(f, s){
  const u = new URL(location.href);
  u.searchParams.set('f', f);
  if (s) u.searchParams.set('s', s); else u.searchParams.delete('s');
  history.replaceState(null, '', u.pathname + u.search + u.hash);
}

function renderFiles(){
  let h = '';
  DOCS.forEach(function(d, i){
    const letter = (d.file.charAt(0) || '?').toUpperCase();
    h += '<button class="file-item" data-f="' + esc(d.file) + '" title="' + esc(d.title) + '">' +
         '<span class="fdot" style="--dot:' + DOT_COLORS[i % DOT_COLORS.length] + '">' + esc(letter) + '</span>' +
         '<span class="fmeta"><strong>' + esc(d.file) + '</strong><small>' + esc(d.title) + '</small></span>' +
         '</button>';
  });
  h += '<div class="file-count">共 ' + DOCS.length + ' 份教程 · 内容原样呈现</div>';
  fileList.innerHTML = h;
  fileCount.textContent = DOCS.length;
}
function markFile(){
  Array.prototype.forEach.call(fileList.querySelectorAll('.file-item'), function(b){
    b.classList.toggle('on', !!current && b.dataset.f === current.file);
  });
}

function groupOpen(g, i){
  return i in collapsed ? collapsed[i] : !!g.open;
}
function renderOutline(){
  if (!current) return;
  const kw = filter.value.trim().toLowerCase();
  let h = '', shown = 0;
  current.groups.forEach(function(g, gi){
    const items = g.items.filter(function(it){
      return !kw || it.t.toLowerCase().indexOf(kw) > -1 || g.name.toLowerCase().indexOf(kw) > -1;
    });
    if (!items.length) return;
    const open = kw ? true : groupOpen(g, gi);
    h += '<div class="grp"><div class="grp-title" data-g="' + gi + '" title="' + esc(g.name) + '">' +
         '<span class="caret' + (open ? ' open' : '') + '" data-fold="1"></span>' +
         '<a class="gname' + (g.h ? ' glink' : '') + '" href="#"' +
         (g.h ? ' data-h="' + esc(g.h) + '"' : '') + '>' + esc(g.name) + '</a>' +
         '<span class="cnt">' + items.length + '</span></div>';
    if (open) {
      h += '<div class="grp-items">';
      items.forEach(function(it){
        h += '<a class="ol-item' + (it.lv ? ' lv1' : '') + '" href="#' + esc(it.h) + '"' +
             ' data-h="' + esc(it.h) + '" title="' + esc(it.t) + '">' + esc(it.t) + '</a>';
      });
      h += '</div>';
    }
    h += '</div>';
    shown += items.length;
  });
  if (!shown) h = '<div class="ol-empty">没有匹配的目录项</div>';
  outline.innerHTML = h;
  const total = current.groups.reduce(function(n, g){ return n + g.items.length; }, 0);
  outlineCount.textContent = total;
  outlineSub.textContent = current.file + ' · ' + total + ' 项';
  markOutline(false);
  syncToggle();
}
function syncToggle(){
  if (!current) return;
  let opened = 0;
  current.groups.forEach(function(g, i){ if (groupOpen(g, i)) opened++; });
  allOpen = opened > current.groups.length / 2;
  toggleAll.textContent = allOpen ? '折叠全部' : '展开全部';
}
function markOutline(scroll){
  if (!current) return;
  let hit = null;
  Array.prototype.forEach.call(outline.querySelectorAll('.ol-item'), function(a){
    const on = a.dataset.h === activeAnchor;
    a.classList.toggle('on', on);
    if (on) hit = a;
  });
  if (scroll && hit && hit.scrollIntoView) hit.scrollIntoView({block:'nearest'});
}

function injectFrameCSS(){
  try {
    const d = frame.contentDocument;
    if (!d || d.getElementById('__agg_hide_side__')) return;
    const st = d.createElement('style');
    st.id = '__agg_hide_side__';
    /* 聚合页已有中栏大纲，隐藏原页面自带的左目录，正文原样保留 */
    st.textContent =
      /* 1. 聚合页已有中栏大纲，隐藏原页面自带的左目录 */
      'nav.side,div.side,aside.side,.side,#sidebar{display:none!important}' +
      /* 2. 原教程把正文写死成 880~1150px，宽屏下右侧会空一大片；
            这里解除所有宽度上限，让正文跟着 iframe 真正弹性铺满 */
      '.wrap,#wrap,.main,#main,main,.container{max-width:none!important;width:auto!important;' +
        'margin:0!important;min-width:0!important}' +
      '.container{flex:1 1 auto!important}' +
      '#main{padding-left:14px!important}' +
      '#cols{width:100%!important}' +
      /* 3. 嵌入阅读时跳过入场淡入，保证正文第一时间完整可见 */
      '.hero,.hero h1,.hero .lead{animation:none!important;opacity:1!important;transform:none!important}' +
      '.hero h1{color:#1f2937!important;-webkit-text-fill-color:#1f2937!important}' +
      '.reveal{opacity:1!important;transform:none!important}';
    d.head.appendChild(st);
    frame.contentWindow.dispatchEvent(new Event('resize'));
  } catch (e) { /* file:// 下不同源，忽略：此时原目录仍在，不影响阅读 */ }
}

function goAnchor(anchor, fromScroll){
  if (!current || !anchor) return;
  activeAnchor = anchor;
  if (!fromScroll) setUrl(current.file, anchor);
  markOutline(false);
  try {
    const win = frame.contentWindow, d = frame.contentDocument;
    const decoded = decodeURIComponent(anchor);
    if (win.location.hash.slice(1) !== decoded) win.location.hash = '#' + encodeURIComponent(decoded);
    setTimeout(function(){
      const el = d.getElementById(decoded);
      if (!el) return;
      /* 原页面普遍设了 scroll-behavior:smooth，平滑滚动在 iframe 里容易卡住，
         这里临时关掉 CSS 平滑，用绝对坐标一次定位到位 */
      const root = d.documentElement;
      const prev = root.style.scrollBehavior;
      root.style.scrollBehavior = 'auto';
      const cur = win.pageYOffset || root.scrollTop || 0;
      const top = el.getBoundingClientRect().top + cur - 12;
      win.scrollTo(0, top > 0 ? top : 0);
      if (el.scrollIntoView) el.scrollIntoView({behavior:'auto', block:'start'});
      setTimeout(function(){ root.style.scrollBehavior = prev; }, 60);
    }, 70);
  } catch (e) {
    frame.src = current.file + '#' + encodeURIComponent(anchor);
  }
}

function onFrameScroll(){
  if (scrollTimer) return;
  scrollTimer = setTimeout(function(){
    scrollTimer = null;
    try {
      const d = frame.contentDocument;
      let best = null, bestTop = -1e9;
      current.groups.forEach(function(g){
        g.items.forEach(function(it){
          const el = d.getElementById(decodeURIComponent(it.h));
          if (!el) return;
          const top = el.getBoundingClientRect().top;
          if (top <= 150 && top > bestTop) { bestTop = top; best = it.h; }
        });
      });
      if (best && best !== activeAnchor) {
        activeAnchor = best;
        markOutline(true);
        setUrl(current.file, best);
      }
    } catch (e) {}
  }, 200);
}

function openDoc(file, anchor){
  const d = byFile[file] || byFile[DEFAULT_DOC] || DOCS[0];
  current = d;
  collapsed = {};
  filter.value = '';
  activeAnchor = anchor || '';
  renderFiles(); markFile(); renderOutline();
  curTitle.textContent = d.title || d.file;
  openNew.href = d.file;
  frame.src = d.file + (anchor ? '#' + encodeURIComponent(anchor) : '');
  setUrl(d.file, anchor || '');
}

fileList.addEventListener('click', function(e){
  const b = e.target.closest('.file-item');
  if (b) openDoc(b.dataset.f, '');
});
outline.addEventListener('click', function(e){
  const a = e.target.closest('.ol-item');
  if (a) { e.preventDefault(); goAnchor(a.dataset.h); return; }
  const gt = e.target.closest('.grp-title');
  if (!gt) return;
  const i = +gt.dataset.g;
  const gname = gt.querySelector('.gname');
  const isCaret = !!e.target.closest('.caret');
  e.preventDefault();
  if (!isCaret && gname && gname.dataset.h) {
    collapsed[i] = true;                 // 跳到分区，同时把该分区展开
    renderOutline();
    goAnchor(gname.dataset.h);
    return;
  }
  collapsed[i] = !groupOpen(current.groups[i], i);
  renderOutline();
});
filter.addEventListener('input', renderOutline);
toggleAll.addEventListener('click', function(){
  allOpen = !allOpen;
  current.groups.forEach(function(g, i){ collapsed[i] = allOpen; });
  renderOutline();
});
focusBtn.addEventListener('click', function(){
  const on = layoutEl.classList.toggle('focus');
  focusBtn.classList.toggle('on', on);
  focusLabel.textContent = on ? '显示目录' : '专注阅读';
  /* 栏宽变化后让内嵌页面按其响应式逻辑重新排版（速查手册的分栏依赖 resize） */
  try { frame.contentWindow.dispatchEvent(new Event('resize')); } catch (e) {}
});
frame.addEventListener('load', function(){
  injectFrameCSS();
  try { frame.contentWindow.addEventListener('scroll', onFrameScroll, {passive:true}); } catch (e) {}
  if (activeAnchor) setTimeout(function(){ goAnchor(activeAnchor); }, 60);
});

renderFiles();
const init = urlParams();
if (init.focus) {
  layoutEl.classList.add('focus');
  focusBtn.classList.add('on');
  focusLabel.textContent = '显示目录';
}
openDoc(byFile[init.f] ? init.f : DEFAULT_DOC, init.s);
</script>
</body>
</html>
