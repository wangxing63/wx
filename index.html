<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的教程站 · 学习资料导航</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <a class="brand" href="index.html">
      <span class="brand-badge">学</span>
      <span class="brand-name">我的教程站</span>
    </a>
    <nav class="header-nav">
      <a href="index.html" class="active">首页</a>
      <a href="#categories">全部教程</a>
      <a href="#tags">标签</a>
    </nav>
  </div>
</header>

<main class="container">

  <section class="hero">
    <h1>个人学习教程站</h1>
    <p>把自己整理过的教程做成静态站点，无需数据库，快速查阅与分享。</p>
    <div class="hero-search">
      <input id="searchBox" type="text" placeholder="输入关键词搜索教程（标题 / 标签 / 简介）" autocomplete="off">
    </div>
    <div class="hero-stats" id="heroStats"></div>
  </section>

  <section id="categories" class="section">
    <h2 class="section-title">全部教程</h2>
    <div id="categoryList"></div>
  </section>

  <section id="tags" class="section">
    <h2 class="section-title">标签</h2>
    <div id="tagCloud" class="tag-cloud"></div>
  </section>

</main>

<footer class="site-footer">
  <p>由个人整理 · 托管于 GitHub Pages · 纯静态站点</p>
</footer>

<script src="assets/app.js"></script>
</body>
</html>
