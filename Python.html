<!DOCTYPE html>
<!-- 单文件自包含版：CSS 与 JS 已全部内联，无任何外部依赖，双击或直接转发即可打开。 -->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Python3 在线速查手册 · 每个名称后面都有一句中文解释</title>
<meta name="description" content="Python3 在线速查手册：数学函数、随机数、三角函数、日期时间、字符串、列表、元组、字典、集合、文件与 OS 方法、常用实例、内置函数、保留关键字。每个名称后面都有一句中文解释。">
<style>
/* ============================================================
   Python3 在线速查手册 —— 版式对齐 w3xue 速查手册
   色值/尺寸取自原站 manual.css 实测：
     页头 #033565（高 105px = 85 + 上下 padding 10，两行 36px 黑体）
     分区标题条 #1D69B0（18px 微软雅黑居中，line-height 40px）
     链接 #0F4B8B / 悬停白字 + rgb(79,129,189) / 已访问 #005DBD
     左栏 278px、条目圆点缩进 15px、正文 12px/18px
     四栏各 24% + 5px 左内边距，右侧留白
   ============================================================ */
:root{
  --navy:      #033565;
  --sec:       #1D69B0;
  --sec-flash: #033565;
  --link:      #0F4B8B;
  --visited:   #005DBD;
  --hover-bg:  rgb(79,129,189);
  --line:      #ccc;
  --row-line:  #e9eff7;   /* 行分隔线：比 #ccc 淡得多，只做视觉分组，不做格线 */
  --text:      #333;
  --muted:     #666;
  --box:       #F2F8FF;
  --box-line:  #d4d4d4;
}
*{box-sizing:border-box}
body{
  margin:0 3px;background:#fff;color:var(--text);
  font:12px/18px Verdana,Tahoma,Arial,sans-serif,"宋体",SimSun,sans-serif;
}

/* ---------- 骨架：左栏目录从顶部开始，蓝头只覆盖右侧 ---------- */
#wrap{display:flex;align-items:flex-start}
#sidebar{
  flex:0 0 282px;width:282px;align-self:flex-start;
  position:sticky;top:0;height:100vh;overflow-y:auto;overflow-x:hidden;
  border-right:1px solid var(--line);
  padding:10px 8px 24px 5px;font-size:12px;
}
#main{flex:1 1 auto;min-width:0;padding-left:20px}   /* 原站 #content 的 padding-left，页头与内容共用同一左边界 */

/* ---------- 页头（对齐原站 #head：总高 105px，两行 36px 黑体） ---------- */
#head{
  position:relative;background:var(--navy);color:#fff;
  height:105px;padding:10px 0;margin:0 auto 16px;
  text-align:center;line-height:40px;overflow:hidden;
}
#head .brand,#head .brand2{
  display:block;color:#fff;text-decoration:none;
  font-family:黑体,SimHei,"Microsoft YaHei",sans-serif;
  font-size:36px;line-height:40px;font-weight:normal;
}
#head .brand{margin-bottom:5px}
#head .brand:hover,#head .brand2:hover{color:#fff;background:none;text-decoration:none}

.search-box{position:absolute;right:18px;top:50%;transform:translateY(-50%)}
#search{
  width:206px;height:28px;padding:0 26px 0 8px;border-radius:2px;
  border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.13);
  color:#fff;font-size:12px;font-family:inherit;outline:none;
}
#search::placeholder{color:#8fb4dd}
#search::-webkit-search-cancel-button{display:none}
#search:focus{background:rgba(255,255,255,.22);border-color:#fff}
#clearSearch{
  position:absolute;right:4px;top:50%;transform:translateY(-50%);
  width:18px;height:18px;line-height:1;padding:0;border:0;border-radius:50%;
  background:rgba(255,255,255,.25);color:#fff;font-size:13px;cursor:pointer;
}
#clearSearch:hover{background:rgba(255,255,255,.45)}

/* ---------- 左侧树形目录（对应原站 dtree：12px / #333 / 行距 19px） ---------- */
.tree-act{margin:0 0 6px;font-size:12px;line-height:19px}
.tree-act a,.tree-act a:link,.tree-act a:visited{color:var(--link);text-decoration:none}
.tree-act a:hover{color:#fff;background:var(--hover-bg);text-decoration:none}
.tree,.tree ul{list-style:none;margin:0;padding:0}
.tree li{line-height:19px}
.tree .folder{
  display:flex;align-items:center;gap:3px;cursor:pointer;
  font-weight:normal;color:#333;user-select:none;font-size:12px;
}
.tree .folder .tri{
  flex:0 0 auto;width:0;height:0;margin-right:2px;
  border-left:4px solid #999;border-top:3px solid transparent;border-bottom:3px solid transparent;
  transition:transform .15s;
}
.tree .open > .folder .tri{transform:rotate(90deg)}
.tree .folder a.sec-link,
.tree .folder a.sec-link:link{color:#333;text-decoration:none;font-weight:normal;font-size:12px}
.tree .folder a.sec-link:hover{color:#fff;background:var(--hover-bg);text-decoration:none}
.tree .sub{display:none;padding-left:14px}
.tree .open > .sub{display:block}
.tree .sub a{
  display:block;color:#333;text-decoration:none;font-size:12px;line-height:19px;
  padding:0 2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.tree .sub a:hover{color:#fff;background:var(--hover-bg);text-decoration:none}
.tree a.sel,.tree a.sel:link{background:#c0d2ec;color:#333}   /* 原站 dtree 选中态 */
.madeby{margin:12px 0 0;padding-top:8px;border-top:1px solid #e6e6e6;color:#999;font-size:12px;line-height:19px}
.madeby b{color:#0F4B8B}

/* ---------- 右侧内容：四栏密排 ---------- */
#content{padding:0 0 60px;min-width:0}
#cols{display:flex;align-items:flex-start;gap:5px;width:95%}
.col{flex:1 1 0;min-width:0}

/* 分区之间的留白：原站只有 3px，这里放大到 16px，让四个分区不糊成一片 */
.sec{margin:0 0 16px}
/* 原站 h1 的 padding/margin 被后面的全局 reset 覆盖，实测标题条就是 40px 高、无内外边距 */
.sec h1{
  margin:0;padding:0;background:var(--sec);color:#fff;
  font-weight:bold;font-size:18px;text-align:center;line-height:40px;
  font-family:"微软雅黑","Microsoft YaHei",sans-serif;
  transition:background .3s;
}
.sec.flash h1{background:var(--sec-flash)}
/* 标题条下方留 7px、条目行距 24px（原站 3px / 18px，太挤）
   每行加一条极淡的下边框（--row-line）：不靠行距分组，靠一条几乎看不见的线把行切出来。
   最后一行不加，避免和分区之间的留白叠成双线。 */
.sec ul{margin:0;padding:7px 0 0;list-style:none}
/* 分隔线要铺满整栏，所以 ul 不留左内边距、缩进改由 li 的 padding-left 提供。
   注意：这时不能再用原生的 list-style:disc —— 圆点会跟着边框盒跑到行右端，
   必须用 ::before 自己画（实测原站圆点是 4×4px、#333，位置对齐如下）。 */
.sec ul li{
  position:relative;margin:0;padding:2px 0 3px 29px;
  line-height:19px;font-size:12px;color:var(--text);
  border-bottom:1px solid var(--row-line);
}
.sec ul li::before{
  content:"";position:absolute;left:14px;top:10px;
  width:4px;height:4px;border-radius:50%;background:#333;
}
/* 必须写 li.item:last-child 而不是 li:last-child：后者的计权 (0,2,2) 高于
   .sec .note 的 (0,2,0)（伪类算一个类），会把补充说明框的虚线底边一起吃掉。 */
.sec ul li.item:last-child{border-bottom:0}
/* 说明框自带虚线边框，紧邻它的那条行分隔线是多余的（两条线只隔 10px） */
.sec ul:has(li.note) li.item:nth-last-child(2){border-bottom:0}
.sec ul li.note::before{content:none}
.sec li.js-hide{display:none}
.sec.js-hide{display:none}

.fn{color:var(--link);text-decoration:none;cursor:pointer;font-size:12px;font-family:Verdana,Tahoma,Arial,sans-serif}
.fn:visited{color:var(--visited)}
.fn:hover{color:#fff;background:var(--hover-bg);text-decoration:none}
.fn:focus{outline:1px dotted var(--link);outline-offset:1px;background:#dbe5f1}
li.open > .fn{font-weight:bold}
.ds{color:#333}
.hit{background:#ffe9a8;color:#333}

.sec .note{
  list-style:none;margin:10px 0 0;padding:6px 8px;   /* ul 已无左内边距，-29px 要去掉，否则盒子会左溢到栏外 */
  background:var(--box);border:1px dashed #b9d3ee;color:#4a5b70;font-size:12px;line-height:17px;
}
.sec .note.js-hide{display:none}

/* ---------- 点击展开的说明 / 示例（pre 沿用原站样式） ---------- */
.det{display:none;margin:8px 0 12px -22px;padding:9px 11px;background:#f7fbff;border:1px solid var(--box-line)}
li.open > .det{display:block}
.det p{margin:0 0 6px;font-size:12px;line-height:18px;color:#444}
.det p:last-child{margin-bottom:0}
.det .meta{margin:0 0 6px;color:#5b6b80;font-size:12px}
.det .meta code{background:#fff;border:1px solid var(--box-line);padding:0 3px;color:var(--link)}
.det .lbl{font-weight:bold;color:#125492}
.det pre{
  margin:10px 0 0;padding:10px;border-left:3px dashed var(--hover-bg);
  background:#efefef;overflow-x:auto;white-space:pre;
  font-family:Consolas,"Courier New",monospace;font-size:12px;line-height:1.7;color:#222;
}
pre .cm{color:#8a93a8;font-style:italic}
pre .st{color:#0f8a4f}
pre .kw{color:#a8248a}
pre .nm{color:#2f6fdb}
pre .bu{color:#b45309}
pre .fs{color:#0e7490}
pre .op{color:#7c5cd6}

/* ---------- 空结果 ---------- */
.no-result{padding:50px 20px;text-align:center;color:#888;font-size:14px;line-height:26px}
.no-result strong{display:block;font-size:16px;color:#555;margin-bottom:6px}

/* 中等宽度：搜索框收窄，避免与居中的品牌字重叠 */
@media (max-width:1240px){
  #search{width:150px}
}

/* ---------- 窄屏：左栏收成顶部一段，栏数交给 JS 按窗口宽度决定 ---------- */
@media (max-width:1000px){
  #wrap{display:block}
  #sidebar{
    position:static;height:auto;max-height:none;width:auto;flex:none;
    border-right:0;border-bottom:2px solid var(--navy);padding:10px 12px 14px;
  }
  #head{height:auto;padding:12px 16px;line-height:34px}
  #head .brand,#head .brand2{font-size:24px;line-height:32px;display:inline-block}
  #head .brand{margin:0 6px 0 0}
  .search-box{position:static;transform:none;margin:10px auto 0;max-width:340px}
  #search{width:100%}
  #content{padding:12px 12px 40px}
  #main{padding-left:0}
  #cols{width:100%}
}

</style>

</head>
<body id="top">

<!-- 版式对齐 w3xue 速查手册：左栏目录从页面顶部开始，蓝色页头只覆盖右侧内容区 -->
<div id="wrap">

  <aside id="sidebar">
    <p class="tree-act">
      <a href="javascript:;" id="expandAll">全部展开</a> |
      <a href="javascript:;" id="collapseAll">全部折叠</a>
    </p>
    <ul class="tree" id="tree"></ul>
    <p class="madeby" id="madeby"></p>
  </aside>

  <div id="main">

    <div id="head">
      <a class="brand" href="#top">Python3</a>
      <a class="brand2" href="#top">在线速查手册</a>

  </div>

</div>

<script>
/* ===== categories.js ===== */
/* 分区定义 —— 顺序与 w3xue 速查手册一致 */

const SECTIONS = [
  { id: 'math',     name: 'Python3 数学函数',         key: 'MATH'     },
  { id: 'random',   name: 'Python3 随机数函数',       key: 'RANDOM'   },
  { id: 'trig',     name: 'Python3 三角函数',         key: 'TRIG'     },
  { id: 'datetime', name: 'Python3 日期和时间',       key: 'DATETIME' },
  { id: 'str',      name: 'Python3 字符串',           key: 'STR'      },
  { id: 'list',     name: 'Python3 列表函数、方法',   key: 'LIST'     },
  { id: 'tuple',    name: 'Python3 元组',             key: 'TUPLE'    },
  { id: 'dict',     name: 'Python3 字典',             key: 'DICT'     },
  { id: 'set',      name: 'Python3 集合',             key: 'SET'      },
  { id: 'file',     name: 'Python3 File(文件) 方法',  key: 'FILE'     },
  { id: 'os',       name: 'Python3 OS 文件/目录方法', key: 'OS'       },
  { id: 'example',  name: 'Python3 实例',             key: 'EXAMPLE'  },
  { id: 'builtin',  name: 'Python3 内置函数',         key: 'BUILTIN'  },
  { id: 'keyword',  name: 'Python3 保留关键字',       key: 'KEYWORD'  }
];

/* 分区末尾的补充说明（可选） */
const SECTION_NOTES = {
  math: 'abs()、round()、pow() 也是内置函数（不用 import 就能用），同名版本见「Python3 内置函数」一节，本节按 w3xue 手册的分类保留；hypot()、degrees()、radians()、math.pi 等与角度和斜边相关的收在「Python3 三角函数」一节。',
  str: '所有字符串方法都返回新字符串，原字符串不会被修改（字符串是不可变类型）。',
  os: '以上是常用的文件/目录操作；Windows 与 Linux 支持的方法不完全一样，完整清单见 Python 官方文档。',
  builtin: '内置函数不需要 import，直接就能用。参数里的方括号 [] 表示可选部分。'
};
;

/* ===== data-builtin.js ===== */
/* 内置函数 —— 共 72 个 */
const BUILTIN = [
{n:'abs(x)', b:'内置求绝对值函数。', r:'数值', d:'返回一个数的绝对值。参数可以是整数、浮点数或复数；如果传的是复数，返回它的模（长度）。', e:'abs(-5)        # → 5\nabs(-3.2)      # → 3.2\nabs(3 + 4j)    # → 5.0'},

{n:'aiter(async_iterable)', b:'返回异步可迭代对象的异步迭代器（Python 3.10+）。', r:'异步迭代器', v:'3.10+', d:'与 iter() 对应，只是作用在异步可迭代对象上，通常配合 async for 使用，较少手写。', e:'async def demo():\n    a = aiter(async_iterable)\n    print(await anext(a))'},

{n:'all(iterable)', b:'判断可迭代对象里的元素是否「全部为真」。', r:'bool', d:'所有元素都为真（或对象为空）时返回 True，只要有一个为假就返回 False。常用作批量条件校验。', e:'all([1, 2, 3])          # → True\nall([1, 0, 3])          # → False\nall([])                 # → True（空的可迭代对象视为真）\nall(x > 0 for x in [1, 2, 3])   # → True'},

{n:'anext(async_iterator[, default])', b:'取异步迭代器的下一个元素（Python 3.10+）。', r:'元素 / default', v:'3.10+', d:'与 next() 对应，异步版本，需要 await。不提供 default 且已耗尽时会抛 StopAsyncIteration。', e:'item = await anext(aiterator)'},

{n:'any(iterable)', b:'判断可迭代对象里是否存在「任意一个为真」的元素。', r:'bool', d:'只要有一个元素为真就返回 True；全部为假（或对象为空）返回 False。', e:'any([0, "", None])      # → False\nany([0, "hi", None])    # → True\nany([])                 # → False'},

{n:'ascii(object)', b:'返回对象的可打印字符串，非 ASCII 字符会转义成 \\x、\\u 形式。', r:'str', d:'与 repr() 类似，但会把非 ASCII 字符转义，因此结果一定是纯 ASCII 字符串。', e:'ascii("中文")     # → "\'\\u4e2d\\u6587\'"\nrepr("中文")      # → "\'中文\'"（不转义）\nascii("abc")     # → "\'abc\'"'},

{n:'bin(x)', b:'把十进制整数转成二进制字符串（带 0b 前缀）。', r:'str', d:'参数必须是整数，或实现了 __index__ 方法的对象。不想要前缀可以用 format(x, "b")。', e:'bin(10)         # → \'0b1010\'\nbin(-10)        # → \'-0b1010\'\nformat(10, "b") # → \'1010\''},

{n:'bool([x])', b:'把任意值转换成布尔值 True / False。', r:'bool', d:'按「真值判定」规则转换：0、0.0、""、[]、{}、()、set()、None、False 都得到 False，其余为 True。', e:'bool(0)        # → False\nbool("")       # → False\nbool([])       # → False\nbool("0")      # → True（非空字符串就是真）'},

{n:'breakpoint(*args, **kws)', b:'在调用处进入调试器（Python 3.7+）。', r:'None', v:'3.7+', d:'相当于 import pdb; pdb.set_trace()。可通过环境变量 PYTHONBREAKPOINT 换成别的调试器，设为 0 则禁用。', e:'for i in range(5):\n    if i == 3:\n        breakpoint()   # 程序在此暂停，进入 pdb'},

{n:'bytearray([source[, encoding[, errors]]])', b:'创建一个可变的字节序列（字节数组）。', r:'bytearray', d:'和 bytes 类似，但内容可以修改。可以通过整数、字符串（需给编码）、可迭代对象或缓冲区来构造。', e:'ba = bytearray(b"abc")\nba[0] = 65\nprint(ba)                 # → bytearray(b\'Abc\')'},

{n:'bytes([source[, encoding[, errors]]])', b:'创建一个不可变的字节序列。', r:'bytes', d:'常用于网络传输、文件读写等二进制场景。字符串转字节要指定编码。', e:'bytes("你好", "utf-8")   # → b\'\\\\xe4\\\\xbd\\\\xa0\\\\xe5\\\\xa5\\\\xbd\'\nbytes([65, 66, 67])     # → b\'ABC\'\nb"abc"                  # → b\'abc\''},

{n:'callable(object)', b:'判断对象能不能被调用（即能不能加括号执行）。', r:'bool', d:'函数、方法、类、实现了 __call__ 的实例都返回 True。常用于检查回调参数是否合法。', e:'callable(print)     # → True\ncallable(len)       # → True\ncallable("abc")     # → False'},

{n:'chr(i)', b:'返回整数对应的 Unicode 字符。', r:'str', d:'是 ord() 的反函数。i 必须是合法码点（0 ~ 0x10FFFF）。', e:'chr(65)       # → \'A\'\nchr(20013)    # → \'中\'\nchr(0x1F600)  # → \'😀\''},

{n:'classmethod(func)', b:'把方法包装成「类方法」的装饰器。', r:'classmethod', d:'类方法的第一个参数是类本身（习惯写成 cls），既能用「类名.方法名」调用，也能用实例调用。常用作替代构造器。', e:'class Foo:\n    @classmethod\n    def from_list(cls, data):\n        return cls()\n\nFoo.from_list([1, 2])'},

{n:'compile(source, filename, mode)', b:'把字符串形式的源码编译成代码对象。', r:'code 对象', d:'mode 可选 exec（语句块）、eval（单个表达式）、single（交互式单行）。编译结果可用 exec() 或 eval() 执行。速度上适合频繁执行的场景。', e:'code = compile("1 + 2", "<string>", "eval")\neval(code)      # → 3'},

{n:'complex([real[, imag]])', b:'创建复数对象。', r:'complex', d:'第一个参数是实部，第二个是虚部。也可以直接从字符串转换。', e:'complex(1, 2)          # → (1+2j)\ncomplex("3+4j")        # → (3+4j)\n(1 + 2j).real          # → 1.0'},

{n:'delattr(obj, name)', b:'删除对象的指定属性。', r:'None', d:'等价于 del obj.name。属性不存在会抛 AttributeError。', e:'class P:\n    x = 1\n    y = 2\n\ndelattr(P, "y")\nprint(hasattr(P, "y"))   # → False'},

{n:'dict(**kwarg)', b:'创建一个字典（键值对集合）。', r:'dict', d:'可以用关键字参数、键值对序列或其他映射对象创建。字典是 Python 最常用的数据结构之一。', e:'dict(a=1, b=2)                  # → {\'a\': 1, \'b\': 2}\ndict([("a", 1), ("b", 2)])      # → {\'a\': 1, \'b\': 2}\ndict(zip("ab", [1, 2]))         # → {\'a\': 1, \'b\': 2}'},

{n:'dir([object])', b:'返回对象的属性名和方法名列表。', r:'list', d:'不传参数时返回当前作用域里的名字列表。交互式调试时非常有用，可以快速看一个对象能做什么。', e:'dir("abc")[:5]\n# → [\'__add__\', \'__class__\', \'__contains__\', \'__delattr__\', \'__dir__\']\ndir()[:3]        # → 当前作用域的名字'},

{n:'divmod(a, b)', b:'同时返回两个数相除的「商」和「余数」。', r:'tuple', d:'返回 (a // b, a % b)。相当于一次算出商和余，常用来做时间/页码换算。', e:'divmod(10, 3)     # → (3, 1)\ndivmod(10, 2)     # → (5, 0)\n# 秒数换算：\ndivmod(3725, 60)  # → (62, 5)  62 分 5 秒'},

{n:'enumerate(iterable, start=0)', b:'给可迭代对象的元素配上序号，返回「序号 + 元素」对。', r:'enumerate 对象', d:'遍历时不想自己维护计数器就用它。序号从 start 开始（默认 0）。', e:'for i, ch in enumerate(["a", "b", "c"], start=1):\n    print(i, ch)\n# → 1 a\n# → 2 b\n# → 3 c'},

{n:'eval(expression[, globals[, locals]])', b:'把字符串当成 Python 表达式求值，并返回结果。', r:'表达式的值', d:'只能处理「表达式」（有返回值），不能处理语句。⚠️ 不要对不可信的输入使用，存在代码注入风险；安全场景用 ast.literal_eval()。', e:'eval("1 + 2 * 3")        # → 7\neval("[i**2 for i in range(4)]")  # → [0, 1, 4, 9]'},

{n:'exec(object[, globals[, locals]])', b:'执行字符串或代码对象形式的 Python 语句。', r:'None', d:'可以执行赋值、循环、函数定义等语句。同样存在安全风险，不要运行来路不明的代码。', e:'exec("a = 1 + 1")\nprint(a)          # → 2\n\nexec("for i in range(3): print(i)")'},

{n:'filter(function, iterable)', b:'按条件过滤可迭代对象，保留函数返回真的元素。', r:'filter 对象', d:'function 为 None 时按真值判定过滤。返回的是惰性对象，通常套一层 list() 看结果。', e:'list(filter(None, [0, 1, "", "a"]))     # → [1, \'a\']\nlist(filter(lambda x: x > 2, range(6)))  # → [3, 4, 5]'},

{n:'float([x])', b:'把字符串或数字转换成浮点数。', r:'float', d:'不能转换时抛 ValueError。也可以直接写小数或科学计数法字面量。', e:'float("3.14")     # → 3.14\nfloat(5)          # → 5.0\nfloat("  1e3 ")   # → 1000.0'},

{n:'format(value[, format_spec])', b:'按格式说明符把值格式化成字符串。', r:'str', d:'就是 f-string 和 str.format() 背后的实现，也实现了内置的格式化迷你语言。', e:'format(3.14159, ".2f")   # → \'3.14\'\nformat(255, "#x")        # → \'0xff\'\nformat(1234567, ",")     # → \'1,234,567\'\nf"{3.14159:.2f}"         # → \'3.14\''},

{n:'frozenset([iterable])', b:'创建不可变集合（可哈希，能当字典的键）。', r:'frozenset', d:'与 set 用法一致，但一旦创建就不能增删元素，所以可以放进 set 里或作为 dict 的键。', e:'fs = frozenset([1, 2, 3])\nprint(fs)                # → frozenset({1, 2, 3})\n{fs: "可以作为字典键"}    # 合法'},

{n:'getattr(object, name[, default])', b:'获取对象的属性值（属性名是字符串）。', r:'属性值', d:'等价于 obj.name，但属性名可以是变量，适合动态访问。给了 default 时属性不存在不会报错。', e:'getattr("abc", "upper")()      # → \'ABC\'\ngetattr({}, "get")(\'k\', 1)      # → 1\ngetattr(obj, "nope", 0)          # → 0'},

{n:'globals()', b:'返回当前模块的全局命名空间字典。', r:'dict', d:'是「活的」字典，修改它会真正改变全局变量。常用于调试或动态注入变量。', e:'g = globals()\ng["x"] = 10\nprint(x)        # → 10'},

{n:'hasattr(object, name)', b:'判断对象是否拥有指定属性。', r:'bool', d:'内部就是尝试 getattr 并捕获异常，常用于「有则用、没有则跳过」的兼容写法。', e:'hasattr("abc", "upper")     # → True\nhasattr("abc", "append")    # → False'},

{n:'hash(object)', b:'返回对象的哈希值（整数）。', r:'int', d:'只有「可哈希」的对象（如 int、str、tuple）才能求哈希。字典和集合就是靠哈希值来快速查找的。', e:'hash("abc")          # → 一个固定整数\nhash((1, 2))          # → 可哈希\n# hash([1, 2])         # 报错：列表不可哈希'},

{n:'help([object])', b:'启动内置帮助系统，查看对象或模块的文档。', r:'None', d:'不传参数会进入交互式帮助，输入 q 退出。看第三方库用法时很方便。', e:'help(str.split)      # 打印 split 的文档\nhelp("modules")       # 列出所有模块'},

{n:'hex(x)', b:'把十进制整数转成十六进制字符串（带 0x 前缀）。', r:'str', d:'同样支持 format(x, "x") 获得不带前缀的写法，大写用 "X"。', e:'hex(255)          # → \'0xff\'\nhex(-16)          # → \'-0x10\'\nformat(255, "X")  # → \'FF\''},

{n:'id(object)', b:'返回对象在内存中的唯一标识（可理解为地址）。', r:'int', d:'在 CPython 里就是对象的内存地址。可用 id() 判断两个变量是否指向同一个对象。', e:'a = [1, 2]\nb = a\nid(a) == id(b)   # → True（同一个对象）\nid(a) == id(list(a))  # → False（副本）'},

{n:'input([prompt])', b:'从键盘读取一行输入，返回字符串。', r:'str', d:'提示语 prompt 会先打印出来。返回值永远是字符串，要参与计算需自己转成 int / float。', e:'name = input("请输入姓名：")\nprint("你好，" + name)\n\nage = int(input("请输入年龄："))'},

{n:'int(x) / int(x, base)', b:'把字符串或数字转换成整数。', r:'int', d:'浮点数转整数是「向零截断」。给 base 时可以把二/八/十六进制字符串转成整数。', e:'int("42")        # → 42\nint(3.99)        # → 3（截断，不是四舍五入）\nint("ff", 16)    # → 255\nint("0b1010", 2) # → 10'},

{n:'isinstance(object, classinfo)', b:'判断对象是否是某个类（或某几个类之一）的实例。', r:'bool', d:'classinfo 可以是类、类型元组或联合类型。比 type(x) == T 更推荐，因为它支持继承关系。', e:'isinstance(5, int)                # → True\nisinstance(True, int)             # → True（bool 是 int 的子类）\nisinstance("a", (int, str))       # → True'},

{n:'issubclass(class, classinfo)', b:'判断一个类是否是另一个类的子类。', r:'bool', d:'类与类之间的继承关系检查。注意参数必须是类，不能是实例。', e:'issubclass(bool, int)        # → True\nissubclass(str, int)         # → False\nissubclass(bool, (int, str)) # → True'},

{n:'iter(object[, sentinel])', b:'返回一个迭代器对象。', r:'迭代器', d:'给了 sentinel 时，会不断调用 object 直到返回值等于 sentinel 才停止。for 循环底层就是在调用 iter()。', e:'it = iter([1, 2, 3])\nnext(it)      # → 1\nnext(it)      # → 2\n\n# 读到文件末尾自动停止\nfor line in iter(f.readline, ""):\n    print(line)'},

{n:'len(s)', b:'返回对象的长度或元素个数。', r:'int', d:'适用于字符串、列表、元组、字典、集合等。对象没有长度会抛 TypeError。', e:'len("hello")      # → 5\nlen([1, 2, 3])    # → 3\nlen({"a": 1})     # → 1\nlen(range(10))    # → 10'},

{n:'list([iterable])', b:'把可迭代对象转换成一个列表。', r:'list', d:'不传参数得到空列表。想复制列表也可以用 list(old)，得到的是浅拷贝。', e:'list("abc")          # → [\'a\', \'b\', \'c\']\nlist(range(3))       # → [0, 1, 2]\nlist((1, 2))         # → [1, 2]\nlist()               # → []'},

{n:'locals()', b:'返回当前作用域的局部命名空间字典。', r:'dict', d:'在函数内部返回该函数的局部变量；在模块顶层等同于 globals()。', e:'def f():\n    a = 1\n    b = 2\n    print(locals())   # → {\'a\': 1, \'b\': 2}\nf()'},

{n:'map(function, iterable, ...)', b:'把函数依次作用到每个元素上，返回结果迭代器。', r:'map 对象', d:'可以传多个可迭代对象，函数会有多个参数。惰性求值，用 list() 取结果。', e:'list(map(str, [1, 2, 3]))              # → [\'1\', \'2\', \'3\']\nlist(map(lambda x: x * 2, [1, 2, 3]))  # → [2, 4, 6]\nlist(map(lambda a, b: a + b, [1, 2], [10, 20]))  # → [11, 22]'},

{n:'max(iterable, *[, key, default])', b:'求最大值。', r:'元素', d:'可传一个可迭代对象，也可传多个参数。key 用来指定比较依据，default 用于空序列。', e:'max([3, 1, 5])                       # → 5\nmax("a", "b", "c")                   # → \'c\'\nmax(["apple", "kiwi"], key=len)      # → \'apple\'\nmax([], default=0)                   # → 0'},

{n:'memoryview(object)', b:'为支持缓冲区协议的对象创建内存视图。', r:'memoryview', d:'可以在不复制数据的前提下按字节或按格式访问底层内存，处理大块二进制数据时更省内存。', e:'data = bytearray(b"abcd")\nmv = memoryview(data)\nbytes(mv[1:3])        # → b\'bc\'\nmv[0] = 65            # 直接修改原数据'},

{n:'min(iterable, *[, key, default])', b:'求最小值。', r:'元素', d:'用法与 max() 完全对称，同样支持 key 和 default。', e:'min([3, 1, 5])                   # → 1\nmin("python")                    # → \'h\'\nmin(["apple", "kiwi"], key=len)  # → \'kiwi\'\nmin([], default=0)               # → 0'},

{n:'next(iterator[, default])', b:'取迭代器的下一个元素。', r:'元素 / default', d:'迭代器耗尽时，给了 default 就返回 default，没给则抛 StopIteration。', e:'it = iter([1, 2])\nnext(it)            # → 1\nnext(it)            # → 2\nnext(it, "结束")    # → \'结束\''},

{n:'object()', b:'所有类的最终基类，创建一个最基础的对象。', r:'object', d:'Python 3 中所有类都隐式继承自 object。它提供 __new__、__init__ 等最基础的能力。', e:'o = object()\no                       # → <object object at 0x...>\nissubclass(int, object) # → True'},

{n:'oct(x)', b:'把十进制整数转成八进制字符串（带 0o 前缀）。', r:'str', d:'常用于 Linux 文件权限的表示。', e:'oct(8)           # → \'0o10\'\noct(64)          # → \'0o100\'\nformat(64, "o")  # → \'100\''},

{n:'open(file, mode="r", ...)', b:'打开文件，返回文件对象。', r:'文件对象', d:'mode 常用：r 读、w 写（清空）、a 追加、b 二进制、+ 读写。务必用 with 自动关闭文件并指定 encoding。', e:'with open("data.txt", "w", encoding="utf-8") as f:\n    f.write("你好")\n\nwith open("data.txt", encoding="utf-8") as f:\n    print(f.read())'},

{n:'ord(c)', b:'返回字符对应的 Unicode 码点（十进制整数）。', r:'int', d:'是 chr() 的反函数，只能传长度为 1 的字符串。', e:'ord("A")     # → 65\noord = ord("中") if False else ord("中")\nord("中")    # → 20013'},

{n:'pow(base, exp[, mod])', b:'求幂运算，可附带取模。', r:'数值', d:'pow(a, b) 等价于 a ** b；pow(a, b, m) 等价于 a ** b % m，但大数运算效率高得多，常用于加密算法。', e:'pow(2, 10)        # → 1024\npow(2, -1)        # → 0.5\npow(3, 3, 5)      # → 2（27 % 5）\npow(2, 100, 97)   # → 大数取模，很快'},

{n:'print(*objects, sep=" ", end="\\n", file=None, flush=False)', b:'把内容输出到屏幕。', r:'None', d:'多个参数默认用空格分隔，结尾自动换行。可用 sep / end 调整，用 file 输出到文件。', e:'print("a", "b", sep="-")     # → a-b\nprint("a", end="")           # 不换行\nprint("b")                   # → ab\nprint("x", file=sys.stderr)  # 输出到错误流'},

{n:'property(fget, fset, fdel, doc)', b:'把方法包装成可以像属性一样读写的「特性」。', r:'property', d:'常用于给属性加校验逻辑，或对外暴露只读属性，同时不破坏 obj.x 的使用方式。', e:'class Circle:\n    def __init__(self, r): self._r = r\n\n    @property\n    def area(self):\n        return 3.14 * self._r ** 2\n\nc = Circle(2)\nc.area        # → 12.56（像属性一样访问）'},

{n:'range(start, stop[, step])', b:'生成一个整数序列（惰性，不占内存）。', r:'range 对象', d:'左闭右开：包含 start，不包含 stop。常配合 for 循环或 list() 使用。', e:'list(range(5))          # → [0, 1, 2, 3, 4]\nlist(range(2, 8, 2))    # → [2, 4, 6]\nlist(range(5, 0, -1))   # → [5, 4, 3, 2, 1]'},

{n:'repr(object)', b:'返回对象的「官方」字符串表示，主要用于调试。', r:'str', d:'目标是让 Python 能看懂：字符串会带引号。与之相对，str() 返回给人看的友好形式。', e:'repr("abc")      # → "\'abc\'"（带引号）\nstr("abc")       # → \'abc\'\nrepr([1, "a"])   # → "[1, \'a\']"'},

{n:'reversed(seq)', b:'返回一个反向迭代器。', r:'迭代器', d:'要求对象支持索引或实现了 __reversed__。本身不修改原序列，需要的话用 list() 取结果。', e:'list(reversed([1, 2, 3]))    # → [3, 2, 1]\nlist(reversed("abc"))        # → [\'c\', \'b\', \'a\']\n"abc"[::-1]                  # → \'cba\''},

{n:'round(number[, ndigits])', b:'对数字四舍五入。', r:'数值', d:'不传 ndigits 返回整数；注意用的是「银行家舍入」（0.5 舍入到最近的偶数），不是简单进位。', e:'round(3.14159, 2)   # → 3.14\nround(2.5)          # → 2（不是 3！）\nround(3.5)          # → 4\nround(2.675, 2)     # → 2.67（浮点精度所致）'},

{n:'set([iterable])', b:'创建一个集合（无序、元素唯一）。', r:'set', d:'最重要的两个用途：去重和集合运算（交、并、差）。元素必须可哈希。', e:'set([1, 2, 2, 3])          # → {1, 2, 3}\nset("hello")               # → {\'h\', \'e\', \'l\', \'o\'}\nset()                      # → 空集合（不是 {}）'},

{n:'setattr(obj, name, value)', b:'设置对象的属性值（属性名是字符串）。', r:'None', d:'等价于 obj.name = value，适合动态赋值。', e:'class P: pass\np = P()\nsetattr(p, "x", 10)\nprint(p.x)      # → 10'},

{n:'slice(start, stop[, step])', b:'创建一个切片对象。', r:'slice', d:'用方括号的 a[1:5:2] 语法底层就在创建 slice。提前存好一个切片对象可以重复使用。', e:'s = slice(1, 5, 2)\n[0,1,2,3,4,5][s]      # → [1, 3]\nlist(range(10))[s]    # → [1, 3]'},

{n:'sorted(iterable, *, key=None, reverse=False)', b:'排序，返回一个新的已排序列表。', r:'list', d:'和 list.sort() 的区别：sorted 不改原数据，任何可迭代对象都能排。key 指定比较依据。', e:'sorted([3, 1, 2])                      # → [1, 2, 3]\nsorted([3, 1, 2], reverse=True)        # → [3, 2, 1]\nsorted(["bb", "a"], key=len)           # → [\'a\', \'bb\']\nsorted(d, key=lambda x: x["age"])      # 按字典字段排序'},

{n:'staticmethod(func)', b:'把方法包装成「静态方法」的装饰器。', r:'staticmethod', d:'静态方法不需要 self 也不接收 cls，只是逻辑上放在类里，通过类名或实例都能调用。', e:'class Math:\n    @staticmethod\n    def add(a, b):\n        return a + b\n\nMath.add(1, 2)   # → 3（不需要实例）'},

{n:'str(object="")', b:'把对象转换成字符串。', r:'str', d:'数字、列表等都能转成人类可读的文本。它是不可变类型，所有字符串方法都返回新字符串。', e:'str(123)          # → \'123\'\nstr(3.14)         # → \'3.14\'\nstr([1, 2])       # → \'[1, 2]\'\nstr(None)         # → \'None\''},

{n:'sum(iterable, start=0)', b:'对一个可迭代对象求和。', r:'数值', d:'start 是起始值（默认 0）。拼接字符串不要用 sum，会因效率被拒绝，用 "".join()。', e:'sum([1, 2, 3])        # → 6\nsum(range(101))       # → 5050\nsum([1, 2], 10)       # → 13\nsum(x*x for x in range(4))   # → 14'},

{n:'super()', b:'返回父类（MRO 中的下一个类）的代理对象。', r:'代理对象', d:'在子类里调用父类被重写的方法，尤其在多重继承时保证调用链正确。Python 3 中直接写 super() 即可。', e:'class A:\n    def hi(self): print("A")\n\nclass B(A):\n    def hi(self):\n        super().hi()      # 调用父类 A 的 hi\n        print("B")\n\nB().hi()   # → A\n           # → B'},

{n:'tuple([iterable])', b:'把可迭代对象转换成元组。', r:'tuple', d:'元组是不可变序列，可以当字典的键。单个元素的元组要写逗号：(1,)。', e:'tuple([1, 2, 3])    # → (1, 2, 3)\ntuple("ab")         # → (\'a\', \'b\')\ntuple()             # → ()\ntype((1))           # → int（不是元组！）\ntype((1,))          # → tuple'},

{n:'break', b:'跳出当前循环（不再继续循环）。', d:'只跳出最内层的那一层循环。常和 if 配合。', e:'for i in range(10):\n    if i == 3:\n        break\n    print(i)          # → 0 1 2\n\nwhile True:\n    if done:\n        break'},

{n:'continue', b:'跳过本次循环的剩余部分，直接进入下一次循环。', d:'注意和 break 的区别：continue 不结束循环，只是「这一轮不做了」。', e:'for i in range(5):\n    if i % 2 == 0:\n        continue       # 跳过偶数\n    print(i)            # → 1 3'},

{n:'pass', b:'空语句：什么都不做，只用来占位。', d:'语法上必须有语句体的地方（函数、类、if）先写 pass，避免报错，占位待补充。', e:'def todo():\n    pass            # 之后再实现\n\nclass Empty:\n    pass\n\nif x:\n    pass\nelse:\n    print("x 为假")'},

{n:'import', b:'导入模块（使用别人写好的代码）。', d:'import 模块名 用「模块.名字」调用；from 模块 import 名字 可以直接用名字。建议把 import 放在文件顶部。', e:'import math\nmath.sqrt(9)              # → 3.0\n\nfrom math import sqrt\nsqrt(9)                   # → 3.0\n\nimport numpy as np\nfrom collections import defaultdict'},

{n:'from', b:'配合 import 使用：从指定模块中导入具体的名字。', d:'from ... import ... 的固定搭配。也可以 from ... import * 导入所有公开名字（不推荐，容易命名冲突）。', e:'from os import path\npath.join("a", "b")       # → \'a/b\'\n\nfrom datetime import date, datetime'},

{n:'as', b:'起别名：给导入的模块或捕获的异常临时换个名字。', d:'两种用法：import ... as 起别名；with ... as 绑定对象；except ... as 捕获异常对象。', e:'import numpy as np\nimport pandas as pd\n\nwith open("a.txt", encoding="utf-8") as f:\n    pass\n\ntry:\n    pass\nexcept ValueError as e:\n    print(e)'},

{n:'with', b:'上下文管理器：自动获取和释放资源。', d:'最典型的用法是打开文件——退出代码块时自动关闭文件，即使中间报错也会关闭。它也支持一次打开多个资源。', e:'with open("a.txt", encoding="utf-8") as f:\n    data = f.read()\n# 出了缩进块，文件已自动关闭\n\nwith open("a.txt") as fi, open("b.txt", "w") as fo:\n    fo.write(fi.read())'},

{n:'try / except / else / finally', b:'异常处理：捕获运行中出错的代码。', d:'try 包住可能出错的代码；except 捕获指定异常；else 在没出错时执行；finally 无论如何都会执行（常用于清理）。', e:'try:\n    n = int("abc")\nexcept ValueError as e:\n    print("转换失败:", e)\nelse:\n    print("成功了")\nfinally:\n    print("无论如何都会执行")\n\n# 捕获多个\ntry:\n    pass\nexcept (TypeError, ValueError):\n    pass'},

{n:'raise', b:'主动抛出异常。', d:'用来在参数不合法时中断流程。raise 后面跟异常类或异常实例，也可以写 raise 单独重抛。', e:'def set_age(a):\n    if a < 0:\n        raise ValueError("年龄不能为负")\n    return a\n\ntry:\n    set_age(-1)\nexcept ValueError as e:\n    print(e)      # → 年龄不能为负'},

{n:'assert', b:'断言：条件不成立就抛 AssertionError。', d:'主要用于调试和自检，写测试时很方便。注意 python -O 运行时断言会被跳过，所以不要用它校验线上业务逻辑。', e:'def divide(a, b):\n    assert b != 0, "除数不能为 0"\n    return a / b\n\ndivide(1, 0)   # → AssertionError: 除数不能为 0'},

{n:'del', b:'删除变量、列表元素或对象属性。', d:'删的是「引用」，Python 会通过垃圾回收自动释放没人引用的对象。删列表元素或字典键很常用。', e:'x = 1\ndel x\n# print(x)        # NameError\n\na = [1, 2, 3]\ndel a[0]          # → [2, 3]\ndel a[:]          # 清空\n\ndel d["key"]      # 删字典键'},

{n:'global', b:'在函数内部声明「我要修改的是全局变量」。', d:'函数里读全局变量不需要声明，但直接赋值默认会创建局部变量，所以必须用 global。少用为妙，容易让代码更难维护。', e:'count = 0\n\ndef inc():\n    global count\n    count += 1\n\ninc()\nprint(count)      # → 1'},

{n:'nonlocal', b:'在嵌套函数里声明「我要修改的是外层函数的变量」。', d:'和 global 类似，但作用范围是「最近的外层函数作用域」，常用于闭包里的状态累加。', e:'def outer():\n    n = 0\n\n    def inner():\n        nonlocal n\n        n += 1\n        return n\n\n    inner()\n    return n\n\nouter()      # → 1'},

{n:'is', b:'身份判断：检查两个变量是否指向「同一个对象」。', d:'和 == 的区别很重要：== 比较值，is 比较内存地址（身份）。判断 None、True、False 时官方推荐用 is。', e:'a = [1, 2]\nb = [1, 2]\na == b          # → True（值相同）\na is b          # → False（不是同一个对象）\n\nx = None\nx is None       # → True（推荐写法）'},

{n:'for ... else / while ... else', b:'循环「正常跑完」时执行 else 块。', d:'如果循环被 break 中断，else 就不会执行。常用于「找了一圈没找到」的逻辑。', e:'for i in range(5):\n    if i == 9:\n        break\nelse:\n    print("没有找到 9")   # 会执行\n\nfor x in [1, 2]:\n    break\nelse:\n    print("不会执行")'},

{n:'yield', b:'把函数变成生成器：每次返回一个值并「暂停」在原地。', d:'函数里有 yield 就不再是普通函数，调用它返回的是生成器对象，用 for 或 next() 逐个取值。优点是惰性求值、省内存，适合处理大数据流。', e:'def count_up(n):\n    for i in range(n):\n        yield i\n\nlist(count_up(3))     # → [0, 1, 2]\n\nfor x in count_up(3):\n    print(x)\n\n# 省内存：一次只产生一个值\ng = (x * x for x in range(10**8))'},

{n:'async / await', b:'定义和等待协程，用于异步编程（Python 3.5+）。', d:'async def 声明协程函数，await 等待一个耗时操作而不阻塞整个程序。常用于高并发网络请求。需要在事件循环里运行（asyncio.run）。', e:'import asyncio\n\nasync def task(n):\n    await asyncio.sleep(1)\n    return n * 2\n\nasync def main():\n    result = await task(3)\n    print(result)      # → 6\n\nasyncio.run(main())'},

{n:'match / case', b:'结构化模式匹配（Python 3.10+），类似其他语言的 switch。', d:'可以按字面值、序列、字典结构甚至类型来匹配，比一长串 if / elif 更清晰。', e:'def http(code):\n    match code:\n        case 200:\n            return "OK"\n        case 404 | 410:\n            return "找不到"\n        case _:              # 兜底\n            return "其他"\n\nhttp(200)   # → \'OK\''}
];

/* ===== app.js ===== */
/* ============================================================
   Python3 在线速查手册 · 交互逻辑
   - 数据来自 categories.js / data-*.js（classic script，支持 file:// 直开）
   - 分区按屏幕宽度自动分配到 N 栏，尽量等高
   ============================================================ */
(function () {
  'use strict';

  /* ---------- 1. 合并数据 ----------
     注意：data-*.js 里用的是 const 声明，const 不会成为 window 的属性，
     所以这里必须用「裸标识符」组装映射表，不能用 window[key] 去取。 */
  var DATA = {
    MATH: MATH, RANDOM: RANDOM, TRIG: TRIG, DATETIME: DATETIME,
    STR: STR, LIST: LIST, TUPLE: TUPLE, DICT: DICT, SET: SET,
    FILE: FILE, OS: OS, EXAMPLE: EXAMPLE, BUILTIN: BUILTIN, KEYWORD: KEYWORD
  };

  var SECS = SECTIONS.map(function (s) {
    return {
      id: s.id,
      name: s.name,
      items: (DATA[s.key] || []).slice(),
      note: SECTION_NOTES[s.id] || ''
    };
  });
  var TOTAL = SECS.reduce(function (n, s) { return n + s.items.length; }, 0);

  /* 给每条生成唯一锚点 id（便于分享链接） */
  var usedId = {};
  SECS.forEach(function (s) {
    s.items.forEach(function (it, i) {
      var base = String(it.n).toLowerCase()
        .replace(/[^\p{L}\p{N}]+/gu, '-')
        .replace(/^-+|-+$/g, '') || (s.id + '-' + i);
      if (usedId[base]) { usedId[base]++; base = base + '-' + usedId[base]; }
      else { usedId[base] = 1; }
      it._id = base;
    });
  });

  /* ---------- 2. 小工具 ---------- */
  function esc(s) {
    return String(s).replace(/[&<>]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c];
    });
  }
  function hit(text, q) { return '<span class="hit">' + text + '</span>'; }
  function mark(text, q) {
    var t = esc(text);
    if (!q) return t;
    var lower = t.toLowerCase(), ql = esc(q).toLowerCase(), out = '', pos = 0, idx;
    if (!ql) return t;
    while ((idx = lower.indexOf(ql, pos)) !== -1) {
      out += t.slice(pos, idx) + hit(t.slice(idx, idx + ql.length));
      pos = idx + ql.length;
    }
    return out + t.slice(pos);
  }

  /* ---------- 3. 轻量 Python 语法高亮 ---------- */
  var PY_KW = ['False','None','True','and','as','assert','async','await','break','class','continue','def','del','elif','else','except','finally','for','from','global','if','import','in','is','lambda','nonlocal','not','or','pass','raise','return','try','while','with','yield','match','case','self','cls'];
  var PY_BI = ['print','len','range','list','dict','set','tuple','str','int','float','bool','sum','min','max','abs','sorted','reversed','enumerate','zip','map','filter','open','type','isinstance','issubclass','help','input','format','round','pow','any','all','divmod','ord','chr','repr','eval','exec','super','property','staticmethod','classmethod','object','vars','dir','getattr','setattr','hasattr','delattr','id','hash','iter','next','slice','bytes','bytearray','frozenset','complex','callable','aiter','anext','breakpoint','memoryview'];
  var KW = {}, BI = {};
  PY_KW.forEach(function (k) { KW[k] = 1; });
  PY_BI.forEach(function (k) { BI[k] = 1; });

  function highlight(code) {
    var out = '', i = 0, n = code.length, j, ch, w, cls, prev;
    while (i < n) {
      ch = code[i];

      if (ch === '#') {                                    /* 注释 */
        j = code.indexOf('\n', i); if (j < 0) j = n;
        out += '<span class="cm">' + esc(code.slice(i, j)) + '</span>';
        i = j; continue;
      }

      if (ch === '"' || ch === "'") {                      /* 字符串 */
        j = i + 1;
        while (j < n) {
          if (code[j] === '\\') { j += 2; continue; }
          if (code[j] === ch) { j++; break; }
          if (code[j] === '\n') break;
          j++;
        }
        out += '<span class="st">' + esc(code.slice(i, j)) + '</span>';
        i = j; continue;
      }

      if (/[0-9]/.test(ch) && !/[A-Za-z0-9_.]/.test(code[i - 1] || '')) {   /* 数字 */
        j = i; while (j < n && /[0-9a-fA-FxXoObBeE._]/.test(code[j])) j++;
        out += '<span class="fs">' + code.slice(i, j) + '</span>';
        i = j; continue;
      }

      if (/[A-Za-z_]/.test(ch)) {                          /* 名字 */
        j = i; while (j < n && /[A-Za-z0-9_]/.test(code[j])) j++;
        w = code.slice(i, j);
        prev = code.slice(0, i).replace(/\s+$/, '').slice(-1);
        cls = null;
        if (KW[w]) cls = 'kw';
        else if (prev === '.') cls = 'fs';
        else if (BI[w]) cls = 'bu';
        else if (code[j] === '(') cls = 'nm';
        out += cls ? '<span class="' + cls + '">' + w + '</span>' : w;
        i = j; continue;
      }

      if ('+-*/%=<>!&|^~@'.indexOf(ch) > -1) {             /* 运算符 */
        out += '<span class="op">' + esc(ch) + '</span>';
        i++; continue;
      }

      out += esc(ch); i++;
    }
    return out;
  }

  /* ---------- 4. 渲染分区与条目 ---------- */
  var colsEl = document.getElementById('cols');
  var secEls = [];       /* 分区 DOM */
  var itemEls = [];      /* itemEls[si][i] = <li> */

  function itemHtml(secId, idx, it) {
    var h = '<li class="item" id="' + it._id + '" data-sec="' + secId + '" data-i="' + idx + '">';
    h += '<a class="fn" role="button" tabindex="0" aria-expanded="false">' + mark(it.n, state.q) + '</a> ';
    h += '<span class="ds">' + mark(it.b, state.q) + '</span>';

    h += '<div class="det">';
    if (it.d) h += '<p><span class="lbl">说明：</span>' + mark(it.d, state.q) + '</p>';
    var meta = [];
    if (it.r) meta.push('返回值：<code>' + esc(it.r) + '</code>');
    if (it.v) meta.push('版本：<code>' + esc(it.v) + '</code>');
    if (meta.length) h += '<p class="meta">' + meta.join(' &nbsp;·&nbsp; ') + '</p>';
    if (it.e) h += '<pre>' + highlight(it.e) + '</pre>';
    h += '</div></li>';
    return h;
  }

  function buildSections() {
    SECS.forEach(function (sec, si) {
      var el = document.createElement('div');
      el.className = 'sec';
      el.id = 's-' + sec.id;

      var html = '<h1>' + esc(sec.name) + '</h1><ul>';
      sec.items.forEach(function (it, i) { html += itemHtml(sec.id, i, it); });
      if (sec.note) html += '<li class="note">' + esc(sec.note) + '</li>';
      html += '</ul>';

      el.innerHTML = html;
      secEls.push(el);
      itemEls.push(Array.prototype.slice.call(el.querySelectorAll('li.item')));
    });
  }

  /* ---------- 5. 分栏 ----------
     要求「分区顺序不能乱」，同时四栏尽量等高。
     贪心（每次塞最矮的一栏）会被内置函数这种超长分区带偏，
     所以这里先量高度，再用动态规划求「保序切成 k 段、使最高的一段最矮」的最优解。 */
  /* 栏数按「可用内容宽度」而不是窗口宽度算：
     窄屏断点会把左栏从侧边挪到顶部，同一个窗口宽度下内容宽度差很多，
     用 window.innerWidth 会在断点附近突然挤出过窄的栏。 */
  function contentWidth() {
    var el = document.getElementById('content');
    return el ? el.clientWidth : window.innerWidth;
  }

  function columnCount() {
    var w = contentWidth();
    if (w >= 1000) return 4;   /* 原站 .col{width:24%} 在桌面端恒定四栏，这里跟到约 242px/栏 */
    if (w >= 760) return 3;
    if (w >= 520) return 2;
    return 1;
  }

  /* 把数组 w 按原顺序切成 k 段，让「段和的最大值」最小。返回每段的起止下标。 */
  function bestPartition(w, k) {
    var n = w.length;
    if (k > n) k = n;
    var pre = [0], i, j, m;
    for (i = 0; i < n; i++) pre.push(pre[i] + w[i]);
    var INF = Infinity;
    var dp = [], cut = [];
    for (j = 0; j <= k; j++) {
      dp.push(new Array(n + 1).fill(INF));
      cut.push(new Array(n + 1).fill(0));
    }
    dp[0][0] = 0;
    for (j = 1; j <= k; j++) {
      for (i = j; i <= n; i++) {
        for (m = j - 1; m < i; m++) {
          var v = Math.max(dp[j - 1][m], pre[i] - pre[m]);
          if (v < dp[j][i]) { dp[j][i] = v; cut[j][i] = m; }
        }
      }
    }
    var groups = [];
    var end = n;
    for (j = k; j >= 1; j--) {
      var st = cut[j][end];
      groups.unshift([st, end]);
      end = st;
    }
    return groups;
  }

  function layout() {
    var n = Math.min(columnCount(), secEls.length || 1);

    colsEl.innerHTML = '';
    var cols = [];
    for (var i = 0; i < n; i++) {
      var d = document.createElement('div');
      d.className = 'col';
      colsEl.appendChild(d);
      cols.push(d);
    }

    /* 先把所有分区临时堆在第 1 栏：此时栏宽已是最终宽度，量出来的高度才准 */
    secEls.forEach(function (el) { cols[0].appendChild(el); });
    var heights = secEls.map(function (el) { return el.offsetHeight; });

    var groups = bestPartition(heights, n);
    groups.forEach(function (g, ci) {
      for (var k = g[0]; k < g[1]; k++) cols[ci].appendChild(secEls[k]);
    });
  }

  /* 筛选态专用：只把「还有命中」的分区按原顺序紧凑塞进各栏，
     谁当前最矮就进谁（可见分区通常只有几个，贪心足够了）。
     否则分区会留在原来的栏里，屏幕上到处是空白。 */
  function packVisible() {
    var n = Math.min(columnCount(), secEls.length || 1);
    colsEl.innerHTML = '';
    var cols = [], hs = [];
    for (var i = 0; i < n; i++) {
      var d = document.createElement('div');
      d.className = 'col';
      colsEl.appendChild(d);
      cols.push(d); hs.push(0);
    }
    secEls.filter(function (el) { return !el.classList.contains('js-hide'); })
      .forEach(function (el) {
        cols[0].appendChild(el);                 /* 先借第 1 栏量高（各栏等宽，高度可比） */
        var h = el.offsetHeight;
        var mi = 0;
        for (var k = 1; k < n; k++) { if (hs[k] < hs[mi]) mi = k; }
        cols[mi].appendChild(el);
        hs[mi] += h;
      });
  }

  function relayout() {
    if (state.q && state.q.trim()) packVisible();
    else layout();
  }

  /* ---------- 6. 左侧目录 ---------- */
  var treeEl = document.getElementById('tree');

  function buildTree() {
    var h = '<li class="open"><span class="folder">' +
      '<span class="tri"></span><span class="ico">📁</span>Python3 在线速查手册</span><ul class="sub">';
    SECS.forEach(function (sec) {
      h += '<li class="node" data-sec="' + sec.id + '"><span class="folder">' +
        '<span class="tri"></span><span class="ico">📂</span>' +
        '<a class="sec-link" href="#s-' + sec.id + '">' + esc(sec.name) + '</a></span>';
      h += '<ul class="sub">';
      sec.items.forEach(function (it, i) {
        /* 带上 data-i：过滤时按它取数据，不依赖「第几个链接」这种位置关系 */
        h += '<li><a href="#' + it._id + '" data-i="' + i + '" data-sec="' + sec.id + '">' + esc(it.n) + '</a></li>';
      });
      h += '</ul></li>';
    });
    h += '</ul></li>';
    treeEl.innerHTML = h;
  }

  treeEl.addEventListener('click', function (e) {
    var a = e.target.closest('a');
    if (a) return;                       /* 条目链接交给 hashchange 处理 */
    var folder = e.target.closest('.folder');
    if (!folder) return;
    folder.parentElement.classList.toggle('open');
  });

  document.getElementById('expandAll').addEventListener('click', function () {
    setAll(true);
  });
  document.getElementById('collapseAll').addEventListener('click', function () {
    setAll(false);
  });

  function setAll(open) {
    Array.prototype.forEach.call(treeEl.querySelectorAll('li.node'), function (li) {
      li.classList.toggle('open', open);
    });
    Array.prototype.forEach.call(document.querySelectorAll('li.item'), function (li) {
      li.classList.toggle('open', open);
      var fn = li.querySelector('.fn');
      if (fn) fn.setAttribute('aria-expanded', open ? 'true' : 'false');
    });
    /* 全部折叠时顺手把滚动条带回顶部，避免停在半路 */
    if (!open) window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  /* ---------- 7. 搜索 ---------- */
  var searchEl = document.getElementById('search');
  var clearEl = document.getElementById('clearSearch');
  var noResultEl = document.getElementById('noResult');
  var madebyEl = document.getElementById('madeby');
  var state = { q: '' };
  var lastQ = null;

  function applyFilter() {
    var q = state.q.trim();
    var ql = q.toLowerCase();
    var shown = 0;

    SECS.forEach(function (sec, si) {
      var visible = 0;
      sec.items.forEach(function (it, i) {
        var li = itemEls[si][i];
        var ok = !ql || (it.n + ' ' + it.b + ' ' + (it.d || '')).toLowerCase().indexOf(ql) > -1;
        li.classList.toggle('js-hide', !ok);
        if (ok) {
          visible++;
          if (q !== lastQ) {
            li.querySelector('.fn').innerHTML = mark(it.n, q);
            li.querySelector('.ds').innerHTML = mark(it.b, q);
          }
        }
      });
      secEls[si].classList.toggle('js-hide', visible === 0);
      var note = secEls[si].querySelector('.note');
      if (note) note.classList.toggle('js-hide', !!ql);
      shown += visible;
    });

    /* 左侧目录同步过滤
       注意：必须用 a[data-i] 而不是 '.sub a'——querySelectorAll 的「祖先部分」
       不受调用元素限制（.sub 只要在文档里任一祖先位置即可），会把根节点的
       分区链接也匹配进来，导致下标越界。 */
    Array.prototype.forEach.call(treeEl.querySelectorAll('li.node'), function (node) {
      var secId = node.getAttribute('data-sec'), sec = null;
      for (var k = 0; k < SECS.length; k++) { if (SECS[k].id === secId) { sec = SECS[k]; break; } }
      var keep = 0;
      Array.prototype.forEach.call(node.querySelectorAll('a[data-i]'), function (a) {
        var it = sec ? sec.items[+a.getAttribute('data-i')] : null;
        var ok = !!it && (!ql || (it.n + ' ' + it.b + ' ' + (it.d || '')).toLowerCase().indexOf(ql) > -1);
        a.parentElement.classList.toggle('js-hide', !ok);
        if (ok) keep++;
      });
      node.classList.toggle('js-hide', keep === 0);
    });

    noResultEl.hidden = shown > 0;
    if (q !== lastQ) {
      madebyEl.innerHTML = ql
        ? '命中 <b>' + shown + '</b> / ' + TOTAL + ' 条'
        : '共 <b>' + TOTAL + '</b> 条 · 点击名称展开说明与示例';
    }
    lastQ = q;

    /* 命中集合变了就要重排：筛选时紧凑打包，清空后回到 DP 均衡分栏 */
    relayout();
  }

  var timer = null;
  searchEl.addEventListener('input', function () {
    clearEl.hidden = !searchEl.value;
    clearTimeout(timer);
    timer = setTimeout(function () {
      state.q = searchEl.value;
      applyFilter();
      if (state.q.trim()) window.scrollTo({ top: 0, behavior: 'smooth' });
    }, 140);
  });
  clearEl.addEventListener('click', function () {
    searchEl.value = ''; state.q = ''; clearEl.hidden = true;
    applyFilter(); searchEl.focus();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === '/' && document.activeElement !== searchEl) {
      e.preventDefault(); searchEl.focus(); searchEl.select();
    }
    if (e.key === 'Escape' && document.activeElement === searchEl) {
      searchEl.value = ''; state.q = ''; clearEl.hidden = true; applyFilter(); searchEl.blur();
    }
  });

  /* ---------- 8. 点击条目展开说明 / 示例 ---------- */
  function toggleItem(li) {
    li.classList.toggle('open');
    var fn = li.querySelector('.fn');
    if (fn) fn.setAttribute('aria-expanded', li.classList.contains('open') ? 'true' : 'false');
    if (li.classList.contains('open')) {
      history.replaceState(null, '', '#' + li.id);
    }
  }

  colsEl.addEventListener('click', function (e) {
    var fn = e.target.closest('.fn');
    if (!fn) return;
    toggleItem(fn.parentElement);
  });

  /* 键盘可达：Enter / 空格 与点击等价（.fn 是无 href 的 <a>，默认不可聚焦，靠 tabindex 兜住） */
  colsEl.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter' && e.key !== ' ' && e.key !== 'Spacebar') return;
    var fn = e.target.closest('.fn');
    if (!fn) return;
    e.preventDefault();
    toggleItem(fn.parentElement);
  });

  /* ---------- 9. 锚点定位 ---------- */
  function scrollToEl(el, offset) {
    var y = el.getBoundingClientRect().top + window.scrollY - (offset || 10);
    var start = window.scrollY;
    try { window.scrollTo({ top: y, behavior: 'smooth' }); }
    catch (err) { window.scrollTo(0, y); }
    setTimeout(function () {
      if (Math.abs(window.scrollY - start) < 4 && Math.abs(start - y) > 4) window.scrollTo(0, y);
    }, 420);
  }

  function gotoHash() {
    var id = decodeURIComponent(location.hash.replace(/^#/, ''));
    if (!id) return;

    /* 原站 dtree 的选中态：同一时刻只高亮一个节点 */
    Array.prototype.forEach.call(treeEl.querySelectorAll('a.sel'), function (a) {
      a.classList.remove('sel');
    });
    var sel = null;

    /* 分区标题 */
    var sec = document.getElementById(id);
    if (sec && sec.classList.contains('sec')) {
      sel = treeEl.querySelector('a.sec-link[href="#' + id + '"]');
      sec.classList.add('flash');
      scrollToEl(sec, 8);
      setTimeout(function () { sec.classList.remove('flash'); }, 1500);
      if (sel) sel.classList.add('sel');
      return;
    }
    /* 具体条目 */
    var li = document.getElementById(id);
    if (li && li.classList.contains('item')) {
      li.classList.add('open');
      var fnEl = li.querySelector('.fn');
      if (fnEl) fnEl.setAttribute('aria-expanded', 'true');
      /* 展开所在分区目录 */
      var si = SECS.findIndex(function (s) { return s.id === li.getAttribute('data-sec'); });
      if (si > -1) {
        var node = treeEl.querySelectorAll('li.node')[si];
        if (node) node.classList.add('open');
      }
      sel = treeEl.querySelector('a[data-sec="' + li.getAttribute('data-sec') + '"][data-i="' + li.getAttribute('data-i') + '"]');
      if (sel) sel.classList.add('sel');
      scrollToEl(li, 12);
      li.style.transition = 'background .3s';
      li.style.background = '#ffe9a8';
      setTimeout(function () { li.style.background = ''; }, 1400);
    }
  }
  window.addEventListener('hashchange', gotoHash);

  /* ---------- 10. 窗口尺寸变化时重新分栏 ---------- */
  var rzTimer = null;
  window.addEventListener('resize', function () {
    clearTimeout(rzTimer);
    rzTimer = setTimeout(relayout, 160);
  });

  /* ---------- 11. 启动 ---------- */
  buildSections();
  buildTree();
  layout();
  applyFilter();
  if (location.hash) setTimeout(gotoHash, 150);
})();
;
</script>
<script>

/* CODE_HIGHLIGHT_V2 START */
(function(){
 'use strict';
 var KW='const|let|var|function|return|if|else|elif|for|in|of|while|break|continue|new|class|extends|import|from|export|default|as|async|await|try|catch|except|finally|raise|with|def|lambda|pass|yield|del|global|nonlocal|assert|this|self|super|typeof|instanceof|void|delete|throw|static|public|private|interface|type|enum|fn|mut|match|where|select|group|order|by|limit|insert|update|create|table|echo|exit|set|call|source|use|package|include|local|readonly|declare|end|then|do|done|fi|case|esac';
 var BI='true|false|null|undefined|None|True|False|NaN|Infinity|document|window|console|Math|JSON|Date|Array|Object|String|Number|Promise|RegExp|ref|reactive|computed|watch|watchEffect|onMounted|onUnmounted|defineProps|defineEmits|defineModel|createApp|axios|localStorage|process|require|module|exports|cls|print|len|range|str|int|float|list|dict|set|tuple|open';
 var RE=new RegExp(
   '(https?://[^\\s"\'<>\x27]+)'+
   '|("(?:\\\\.|[^"\\\\])*"|\x27(?:\\\\.|[^\x27\\\\])*\x27|`(?:\\\\.|[^`\\\\])*`)'+
   '|(<\\/?[A-Za-z][\\w-]*(?:\\s[^<>]*)?\\/?>)'+
   '|(\\/\\/[^\\n]*|\\/\\*[\\s\\S]*?\\*\\/)'+
   '|(@[A-Za-z_$][\\w$]*|v-[a-z]+|--?[A-Za-z][\\w-]*)'+
   '|(\\b(?:0x[0-9a-fA-F]+|\\d+(?:\\.\\d+)*)\\b)'+
   '|\\b('+KW+')\\b'+
   '|\\b('+BI+')\\b'+
   '|((?:\\.[A-Za-z_$][\\w$]*|[A-Za-z_$][\\w$]*))(?=\\s*\\()'+
   '|(\\.[A-Za-z_$][\\w$]*)'+
   '|([=+\\-*/%<>!&|?:^~]+)'
 ,'g');
 var CLS=['tk-url','tk-str','tk-tag','tk-cmt','tk-opt','tk-num','tk-kw','tk-bi','tk-fn','tk-prop','tk-op'];
 function kind(m){ for(var i=1;i<=CLS.length;i++){ if(m[i]!==undefined) return CLS[i-1]; } return null; }
 function isDark(pre){
   var el=pre,c,m,tries=0;
   while(el&&tries<4){
     c=getComputedStyle(el).backgroundColor;
     m=(c||'').match(/[\d.]+/g);
     if(m&&m.length>=3&&!(m.length>3&&parseFloat(m[3])<0.25)){
       return (0.299*parseFloat(m[0])+0.587*parseFloat(m[1])+0.114*parseFloat(m[2]))<128;
     }
     el=el.parentElement; tries++;
   }
   return false;
 }
 function skip(pre){
   if(pre.hasAttribute('data-hl')) return true;
   if(pre.classList&&pre.classList.contains('output')) return true;
   if(/out/i.test(pre.id||'')) return true;
   var p=pre.parentElement;
   while(p&&p!==document.body){
     if(p.classList&&(p.classList.contains('out')||p.classList.contains('demo')||p.classList.contains('output'))) return true;
     p=p.parentElement;
   }
   return false;
 }
 function paint(node){
   var text=node.nodeValue;
   if(!text||!text.trim()) return;
   var frag=document.createDocumentFragment(),last=0,m,hit=false;
   RE.lastIndex=0;
   while((m=RE.exec(text))!==null){
     if(m[0].length===0){ RE.lastIndex++; continue; }
     if(m.index>last) frag.appendChild(document.createTextNode(text.slice(last,m.index)));
     var sp=document.createElement('span');
     sp.className=kind(m)||'tk-op';
     sp.textContent=m[0];
     frag.appendChild(sp);
     last=m.index+m[0].length; hit=true;
   }
   if(!hit) return;
   if(last<text.length) frag.appendChild(document.createTextNode(text.slice(last)));
   if(node.parentNode) node.parentNode.replaceChild(frag,node);
 }
 var mo=null, pending=false;
 function run(){
   if(mo) mo.disconnect();
   var pres=document.querySelectorAll('pre');
   for(var i=0;i<pres.length;i++){
     var pre=pres[i];
     if(skip(pre)) continue;
     var target=pre;
     if(pre.children.length===1&&pre.firstElementChild&&pre.firstElementChild.tagName==='CODE') target=pre.firstElementChild;
     var nodes=[],n=target.firstChild;
     while(n){ if(n.nodeType===3) nodes.push(n); n=n.nextSibling; }
     for(var j=0;j<nodes.length;j++) paint(nodes[j]);
     if(isDark(pre)) pre.classList.add('hl-dark');
     pre.setAttribute('data-hl','1');
   }
   if(mo) mo.observe(document.body,{childList:true,subtree:true});
 }
 function schedule(){
   if(pending) return;
   pending=true;
   (window.requestAnimationFrame||function(f){setTimeout(f,60);})(function(){ pending=false; run(); });
 }
 run();
 if(window.MutationObserver){
   mo=new MutationObserver(function(muts){
     for(var i=0;i<muts.length;i++){
       var a=muts[i].addedNodes;
       for(var j=0;j<a.length;j++){
         if(a[j].nodeType!==1) continue;
         if(a[j].tagName==='PRE'||(a[j].querySelectorAll&&a[j].querySelectorAll('pre').length)){ schedule(); return; }
       }
     }
   });
   mo.observe(document.body,{childList:true,subtree:true});
 }
 window.addEventListener('load',schedule);
})();

</script>
